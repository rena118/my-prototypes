"y": 1, "rx": 0.02, "ry": 0.2}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "d70836a9-3805-41b9-9f9d-1f9a2d30863a", "pageId": "manage-publish", "stateId": "default", "number": 3, "body": "【A-03 时间校验】\n· 结束时间必须晚于开始时间，否则阻止提交并定位到时间字段。\n· 活动日期不得早于当前日期；同一天允许多场，但需提示时段冲突。\n· 时长自动计算并展示，不支持跨天活动。\n· 所有时间按学校所在时区存储，前端不做本地时区换算。\n【待确认】是否允许补录过去的活动。", "anchor": {"selector": ".time-select-group"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "a38116f4-51b6-4bb3-aa0a-69475289a0b8", "pageId": "manage-publish", "stateId": "default", "number": 4, "body": "【A-04 每周重复生成】\n· 勾选后按所选日期的星期几每周生成一场，直到「截止至」日期（含）。\n· 截止日期不得超过当前学期结束日；起始日期晚于截止日期时生成 0 场，提交按钮禁用。\n· 生成场次实时预览「共 N 场」；批量活动标题相同，标注「每周固定 · 第 i/N 场」。\n· 每场活动各自独立考勤与活动记录，不共享。\n【待确认】是否需要支持跳过节假日、双周或自定义间隔。", "anchor": {"selector": ".repeat-toggle-row"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "a8ea6b6c-3a5d-4f0e-bace-1233cd5b55ab", "pageId": "manage-publish", "stateId": "default", "number": 5, "body": "【A-05 活动地点】\n· 两种方式：从场地库选择（默认带出本社常规场地）/ 手动输入。\n· 场地库数据来自学校场地配置，需展示场地可用状态。\n· 手动输入必填且去空格；最终地点为空时回退为本社常规场地。\n【待确认】选择场地库时是否校验同一场地同一时段已被占用。", "anchor": {"selector": ".venue-radio-row"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "b7f47d5a-f400-40b7-bdfa-a3f97ed59862", "pageId": "manage-publish", "stateId": "default", "number": 6, "body": "【A-06 相关附件】\n· 支持多文件上传，展示文件名与大小，可逐个删除。\n· 限制类型与单文件大小，建议 pdf/doc/xls/图片，单文件 ≤20MB。\n· 附件随活动保存，成员在活动详情可下载。\n· 原型为模拟上传，不产生真实文件，正式版需走对象存储。\n【待确认】附件数量上限与是否允许压缩包。", "anchor": {"selector": ".clean-upload-row"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "525c2706-c535-4c44-b502-581bfedb246f", "pageId": "manage-publish", "stateId": "default", "number": 7, "body": "【A-07 发布结果与联动】\n· 发布后生成 status=upcoming 的活动，考勤状态与记录状态均为 pending。\n· 同步出现在「社团活动」列表、「我报名的」活动区、社团详情近期活动。\n· 向全体正式成员推送站内通知，通知含活动名称、时间、地点。\n· 发布失败需保留表单内容并提示重试；接口需幂等，避免重复创建。\n【待确认】活动是否需要教师审核后才对学生可见。", "anchor": {"selector": ".publish-drawer-footer-clean"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "4d4695dd-b456-48dd-ac39-f5fbbab84fba", "pageId": "manage-publish", "stateId": "default", "number": 8, "body": "【A-08 异常与埋点】\n· 必填未填、时间非法、周期生成 0 场时禁止提交，并定位到对应字段。\n· 提交中禁用按钮，防重复提交。\n· 埋点：发布入口点击、单次/周期选择、发布成功场次、失败原因。\n· 权限：仅社长；教师端不使用该抽屉。", "anchor": {"selector": ".publish-clean-form"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.95}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "e9380f80-2167-4afd-8385-8536c906fabf", "pageId": "manage-renew", "stateId": "default", "number": 1, "body": "【N-01 申请入口与前置条件】\n· 仅生命周期=未发起任何申请（none）时可发起；提前结束审核中（end_pending/end_returned）禁用。\n· 历史学期归档、社团已提前结束时不可发起。\n· 同一学期只允许 1 条有效延续申请；教师退回后可修改重提。\n· 申请由负责教师审批，审批期间社团日常运行不受影响。\n【待确认】申请开放时间窗口（建议期末前 4 周至学期结束）。", "anchor": {"selector": ".renew-club-dialog"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.02, "ry": 0.02}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "f8c7cbd8-8455-4db7-a8d5-61cafb1713c2", "pageId": "manage-renew", "stateId": "default", "number": 2, "body": "【N-02 延续目标学期与容量】\n· 目标学期自动取当前学期的下一学期，只读展示，不允许跨学期选择。\n· 计划人数上限必填、整数，范围 5–100，且需 ≥ 保留成员数。\n· 容量为下学期招新上限，不改变本学期容量。\n· 学期配置缺失时禁止提交并提示联系管理员。", "anchor": {"selector": ".modal-two-cols"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "3988aa06-2c6a-4661-86d8-8fd7d4a0443d", "pageId": "manage-renew", "stateId": "default", "number": 3, "body": "【N-03 下一学期社长】\n· 默认沿用当前社长，只读展示，不可在此更换。\n· 教师审批时可按实际情况调整社长，调整结果需通知原社长与新社长。\n【待确认】社长毕业或离校时的继任规则。", "anchor": {"selector": ".renew-leader-card"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "272b56ca-321f-41e8-9707-6753c4510811", "pageId": "manage-renew", "stateId": "default", "number": 4, "body": "【N-04 保留成员选择】\n· 默认全选当前学期有效成员；社长本人强制保留且不可取消。\n· 毕业、离校、已退出成员不进入候选列表。\n· 至少保留社长 1 人；取消勾选不删除本学期记录，仅决定下学期带入名单。\n· 已选人数实时展示，并与容量校验联动。\n【待确认】是否允许保留非本学期成员（如休学返校）。", "anchor": {"selector": ".renew-members-section"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "d2c7f025-1f69-4df4-acde-a78f1a403bc6", "pageId": "manage-renew", "stateId": "default", "number": 5, "body": "【N-05 下学期是否继续招新】\n· 二选一：继续招新 / 暂不招新，默认继续招新。\n· 继续招新时，剩余名额=容量−保留人数，用于下学期广场报名。\n· 暂不招新时，下学期广场不展示报名入口，仅展示社团信息。\n【待确认】暂不招新后是否可在下学期中途重新开启。", "anchor": {"selector": ".renew-recruiting-section"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "bf480a7e-7658-4e63-bd8d-08422a4efd17", "pageId": "manage-renew", "stateId": "default", "number": 6, "body": "【N-06 更新下一学期社团资料】\n· 点击进入「延续资料填写」页，维护下学期名称、简介、活动计划等；返回后保留已填容量与成员选择。\n· 资料仅下学期生效，不覆盖本学期档案。\n· 未填写资料也可直接提交，默认继承本学期资料。\n【待确认】社团名称变更是否需要教师另行审批。", "anchor": {"selector": ".renew-update-button"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "df066fb5-e856-4aee-b9a0-544fe43d00b2", "pageId": "manage-renew", "stateId": "default", "number": 7, "body": "【N-07 提交与审批流转】\n· 提交后进入 renew_pending，左侧按钮区替换为「延续申请审批中」卡片，可查看详情或撤回。\n· 教师退回（renew_returned）展示退回原因，可「修改重提」或「撤销申请」。\n· 教师通过（renew_approved）生成下学期社团记录并保留所选成员，本学期档案不变。\n· 撤回与撤销仅在教师审批前允许。\n【待确认】审批时限与超时自动关闭规则。", "anchor": {"selector": ".dialog-actions"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "1cc1dacf-79c9-4c30-905e-890f52543835", "pageId": "manage-renew", "stateId": "default", "number": 8, "body": "【N-08 数据影响与幂等】\n· 延续通过后新建下学期 club 记录，需与上学期建立关联（parentClubId）。\n· 保留成员在下学期生成 joined 记录，加入日期=下学期开始日。\n· 本学期活动、考勤、学时、学分记录全部保留，不迁移、不删除。\n· 重复提交需幂等，禁止生成多条下学期记录。\n【待确认】下学期社团是否需要重新走申报审核。", "anchor": {"selector": ".renew-members-section"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.95}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "49953fc6-0e0b-45d4-bc90-ea0b375e7de5", "pageId": "manage-renew", "stateId": "default", "number": 9, "body": "【N-09 异常与埋点】\n· 容量小于保留人数、目标学期缺失、重复提交时阻止并提示。\n· 提交中禁用按钮，防重复提交；失败保留表单内容。\n· 埋点：延续入口点击、提交成功率、撤回率、教师退回原因分布。\n· 权限：仅社长发起；教师端审批。", "anchor": {"selector": ".renew-club-dialog"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.95}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:00:46.583Z"}, {"id": "8f3a2c41-6b7d-4e58-9a10-2c3d4e5f6a71", "pageId": "manage-activities", "stateId": "default", "number": 1, "body": "【E-01 页面定位与数据范围】\n· 本页为「我管理的 → 社团活动」tab，仅展示当前登录社长所管理社团的活动；数据范围限定当前学期，历史学期需切换学期档案且只读。\n· 活动实体与「社团报告」「社团学分」「社团风采」同源，考勤与记录状态必须单向同步，禁止各页各自维护。\n· 列表默认按活动日期倒序，同一天按开始时间倒序。\n· 权限：社长可维护；成员端在「我报名的 → 社团详情」只读查看。\n【待确认】学期切换入口是否在本页提供，还是统一由左侧社团/学期切换器控制。", "anchor": {"selector": ".manage-tab-content"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.02, "ry": 0.02}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "9b4c3d52-7c8e-4f69-8b21-3d4e5f6a7b82", "pageId": "manage-activities", "stateId": "default", "number": 2, "body": "【E-02 活动状态机与判定】\n· 三态：upcoming（待开展）/ ongoing（进行中）/ completed（已结束）。\n· 判定以活动日期与起止时间为准：开始前=待开展，开始至结束=进行中，结束后=已结束；由服务端在读取或定时任务中计算，前端不持久化 statusLabel。\n· 状态只影响操作入口与展示，不限制编辑（归档学期除外）。\n· 待开展不展示出勤与记录状态，也不允许考勤；进行中与已结束可考勤。\n【待确认】跨天/跨时段活动的状态判定口径；活动提前结束时是否允许手动置为已结束。", "anchor": {"selector": ".activities-filter-pills"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "0c5d4e63-8d9f-4a70-9c32-4e5f6a7b8c93", "pageId": "manage-activities", "stateId": "default", "number": 3, "body": "【E-03 筛选与计数】\n· 四档：全部 / 进行中 / 待开展 / 已结束，计数为当前社团当前学期对应状态的活动条数，实时计算。\n· 筛选仅作用于卡片列表，不改变「查看全部活动瞬间」的统计口径。\n· 默认「全部」；筛选状态不持久化，刷新后回到全部。\n· 筛选无结果时保留筛选器并展示空态，不展示空列表头。\n【待确认】是否需要按活动类型（常规/专项）或场地筛选。", "anchor": {"selector": ".activities-filter-pills"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.02, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "1d6e5f74-9e0a-4b81-8d43-5f6a7b8c9d04", "pageId": "manage-activities", "stateId": "default", "number": 4, "body": "【E-04 活动卡片字段】\n· 日期徽标：月.日 + 周几，取自活动日期，不随筛选变化。\n· 标题、状态角标、时间区间、场地；进行中/已结束额外展示出勤摘要（应到/实到/迟到/请假/缺勤）与活动记录状态。\n· 活动说明、附件（名称+大小，可预览/下载）、活动瞬间分享数。\n· 空值兜底：附件为空不展示附件区；说明为空不展示说明行；分享数为 0 时仍展示入口并显示「0 份分享」。\n【待确认】附件是否限制格式与单文件大小；附件下载权限是否仅限本社团成员。", "anchor": {"selector": ".clean-event-card"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "2e7f6a85-0f1b-4c92-9e54-6a7b8c9d0e15", "pageId": "manage-activities", "stateId": "default", "number": 5, "body": "【E-05 卡片操作优先级】\n· 主按钮互斥：未考勤且非待开展 →「考勤点名」；已考勤且记录未提交 →「填写活动记录」；两者完成后主按钮消失。\n· 常驻次按钮「查看详情」打开活动详情抽屉；更多菜单承载编辑、修改考勤、修改记录、删除。\n· 待开展卡片仅保留「查看详情」与更多（编辑/删除），不展示考勤与记录入口。\n· 归档学期所有写操作按钮禁用，仅可查看详情。\n【待确认】考勤与记录是否允许并行办理（当前实现为串行优先级）。", "anchor": {"selector": ".clean-actions-row"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "3f8a7b96-1a2c-4d03-8f65-7b8c9d0e1f26", "pageId": "manage-activities", "stateId": "default", "number": 6, "body": "【E-06 考勤点名规则】\n· 考勤对象=当前社团正式成员（不含待审核入团、已取消成员），应到人数取成员名单实时值。\n· 四态：present 到场 / late 迟到 / leave 请假 / absent 缺勤；支持「一键全员到场」。\n· 实到=present+late；出勤统计必须与「社团学分」「社团报告」口径一致。\n· 保存后 attendanceStatus=completed，写回成员出勤台账；迟到是否计全勤需与学分页统一。\n· 再次进入为「查看与调整考勤」，调整需留痕（操作人、时间、前后差异）。\n【待确认】活动开始前是否允许提前点名；请假是否需成员提前申请并留凭证。", "anchor": {"selector": ".clean-meta-line"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.02, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "4a9b8ca7-2b3d-4e14-9a76-8c9d0e1f2a37", "pageId": "manage-activities", "stateId": "default", "number": 7, "body": "【E-07 活动记录规则】\n· 活动小结必填（去首尾空格），现场照片/成果附件可选、支持多张，引导研讨议题可选。\n· 保存后 recordStatus=submitted，记录沉淀至活动档案，作为社团报告素材。\n· 已提交可「修改活动记录」，修改不重置考勤状态。\n· 未填时卡片展示「未填活动记录」；归档后只读。\n【待确认】活动记录是否要求活动结束后才能填写；照片数量与格式上限。", "anchor": {"selector": ".clean-event-card"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.95}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "5b0c9db8-3c4e-4f25-8b87-9d0e1f2a3b48", "pageId": "manage-activities", "stateId": "default", "number": 8, "body": "【E-08 编辑与删除】\n· 编辑活动信息全阶段可用（归档除外），复用发布表单，保存后同步更新卡片与详情抽屉。\n· 删除必须二次确认；已有考勤或成员分享时，弹窗需列明影响（考勤记录、N 份活动瞬间），并提供「暂不删除，去修改活动」。\n· 删除为级联操作：同时移除考勤、活动记录、成员瞬间与研讨、关联学分依据；需明确是否允许物理删除。\n· 删除后列表、筛选计数、活动瞬间汇总页需实时刷新。\n【待确认】已产生考勤/学分的活动是否允许删除，还是仅允许「作废」并保留审计痕迹。", "anchor": {"selector": ".clean-actions-row"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.95, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "6c1d0ec9-4d5f-4a36-9c98-0e1f2a3b4c59", "pageId": "manage-activities", "stateId": "default", "number": 9, "body": "【E-09 活动瞬间入口与汇总】\n· 单场入口：卡片底部「活动瞬间 N 份分享」→ 该场活动瞬间页。\n· 汇总入口：工具栏「查看全部活动瞬间 N」→ 汇总页，按活动发生时间倒序、按月分组，支持按活动筛选。\n· 汇总统计=所有活动分享数之和；覆盖活动数=有分享的活动数；筛选只影响展示，不影响统计。\n· 仅展示本社团成员的分享；归档学期只读，禁止发布与精选。\n【待确认】活动瞬间子页面需求是否单独维护（本页当前仅覆盖入口与汇总规则）。", "anchor": {"selector": ".ledger-enter"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "7d2e1fda-5e6a-4b47-8d09-1f2a3b4c5d6a", "pageId": "manage-activities", "stateId": "default", "number": 10, "body": "【E-10 空态、权限与埋点】\n· 无活动：展示空态并引导「发布新活动」；筛选无结果：展示「暂无该状态活动」并保留筛选器。\n· 成员端不可见本页；教师端使用独立视图。\n· 埋点：筛选切换、考勤打开/保存、记录打开/保存、编辑、删除确认与取消、活动瞬间入口点击。\n· 异常：保存失败需保留弹窗内容并提示重试，禁止静默关闭导致数据丢失。", "anchor": {"selector": ".event-cards-list"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.95}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "8e3f2aeb-6f7b-4c58-9e10-2a3b4c5d6e7b", "pageId": "manage-showcase", "stateId": "default", "number": 1, "body": "【G-01 页面定位与数据范围】\n· 本页为「我管理的 → 成果荣誉」tab，包含「作品集锦」与「荣誉时刻」两类内容，范围为当前社团、当前学期；历史学期需归档只读。\n· 内容由社长统一上传/登记，公开展示同步至「我报名的 → 社团详情 → 社团风采」，不进入教师逐项审核。\n· 作品与荣誉为两条独立数据表，字段与展示结构不同，禁止合并为同一实体。\n· 归档学期只读，禁止上传、编辑、删除。\n【待确认】历史学期的作品/荣誉是否继续在社团风采展示，还是仅展示当前学期。", "anchor": {"selector": ".mgf-content"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.02, "ry": 0.02}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "9f4a3bfc-7a8c-4d69-8f21-3b4c5d6e7f8c", "pageId": "manage-showcase", "stateId": "default", "number": 2, "body": "【G-02 双 Tab 与计数】\n· 作品集锦 / 荣誉时刻两个子 tab，计数为各分类当前条数。\n· 切换 tab 只影响列表与主按钮文案（上传作品 / 登记荣誉），不改变页面其他状态。\n· 默认进入作品集锦；tab 状态不持久化。\n· 列表排序按上传时间倒序，最新上传排首位。\n【待确认】是否需要按学期或获奖年份筛选。", "anchor": {"selector": ".gallery-subtabs"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "a05b4c0d-8b9d-4e70-9a32-4c5d6e7f8a9d", "pageId": "manage-showcase", "stateId": "default", "number": 3, "body": "【G-03 作品卡片字段】\n· 封面（建议 16:9 横图）、作品名称、创作者署名、作品介绍、上传人（社长）、上传日期。\n· 作品名称未填时落库为「未命名作品」，展示同值。\n· 创作者支持「全体成员」或多人署名：展示为全体成员 / A、B / 已选 N 人（超过 2 人折叠）。\n· 介绍为空时不展示介绍行，不占位。\n【待确认】作品是否支持视频作为封面，以及视频时长/大小上限。", "anchor": {"selector": ".mgf-grid"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "b16c5d1e-9c0e-4f81-8b43-5d6e7f8a9b0e", "pageId": "manage-showcase", "stateId": "default", "number": 4, "body": "【G-04 荣誉卡片字段】\n· 荣誉证明（证书/奖牌照片）、荣誉名称、获奖时间、荣誉说明、上传人、上传日期。\n· 荣誉名称未填时落库为「未命名荣誉」。\n· 获奖时间按「年-月」存储与展示，未填时默认当前月。\n· 说明为空时不展示说明行。\n【待确认】荣誉是否区分级别（校级/区级/市级）并支持筛选。", "anchor": {"selector": ".mgf-grid"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.95, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "c27d6e2f-0d1f-4a92-9c54-6e7f8a9b0c1f", "pageId": "manage-showcase", "stateId": "default", "number": 5, "body": "【G-05 上传作品规则】\n· 入口仅页面右上角「上传作品」，作品 tab 内不重复提供。\n· 素材必填（JPG/PNG/MP4，建议 16:9）；作品名称选填（≤40 字）；创作者默认「全体成员」；介绍选填（≤120 字）。\n· 提交后立即写入并置顶展示，同时同步至社团风采，无需教师审核。\n· 提交中禁用按钮防重复提交；失败保留已填内容。\n【待确认】素材是否允许多图/多视频混排，单文件大小上限。", "anchor": {"selector": ".mgf-hero-actions"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "d38e7f30-1e2a-4b03-8d65-7f8a9b0c1d2a", "pageId": "manage-showcase", "stateId": "default", "number": 6, "body": "【G-06 登记荣誉规则】\n· 荣誉证明必填（JPG/PNG，建议证书四角完整、文字清晰）；荣誉名称选填（≤40 字）；获奖时间选填（默认当前月）；说明选填（≤120 字）。\n· 提交后立即公开展示并同步至社团风采。\n· 荣誉证明缺失时阻止提交并定位到上传区。\n· 提交中禁用按钮防重复提交。\n【待确认】是否支持一次登记多项荣誉（批量上传）。", "anchor": {"selector": ".mgf-hero"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.95}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "e49f8a41-2f3b-4c14-9e76-8a9b0c1d2e3b", "pageId": "manage-showcase", "stateId": "default", "number": 7, "body": "【G-07 创作者选择规则】\n· 默认选中「全体成员」；勾选任一成员自动取消「全体成员」；勾选「全体成员」清空已选成员，二者互斥。\n· 候选=当前社团正式成员，不含待审核与已退出成员。\n· 允许仅选 1 人；未选择时保存兜底为「社团成员」。\n· 创作者署名会公开展示，需与实际创作成员一致，避免署名争议。\n【待确认】是否允许填写社团外创作者（如联合创作的其他班级学生）。", "anchor": {"selector": ".mgf-subtabs-row"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.95, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "f5a09b52-3a4c-4d25-8f87-9b0c1d2e3f4c", "pageId": "manage-showcase", "stateId": "default", "number": 8, "body": "【G-08 预览、编辑与删除】\n· 点击卡片打开预览：大图 + 名称 + 创作者/获奖时间 + 说明 + 上传信息。\n· 卡片「管理」进入编辑/删除；编辑复用上传表单并回填原值；删除需二次确认。\n· 归档学期禁用管理与上传，仅可预览。\n· 编辑/删除后需同步刷新社团风采，禁止缓存旧数据。\n【待确认】删除已公开展示的内容是否需要教师确认，或采用软删除保留审计。", "anchor": {"selector": ".gcard"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "a6b10c63-4b5d-4e36-9a98-0c1d2e3f4a5d", "pageId": "manage-showcase", "stateId": "default", "number": 9, "body": "【G-09 空态、权限与埋点】\n· 分类空态文案区分：作品「还没有作品」/荣誉「还没有荣誉」，并提示右上角上传入口。\n· 权限：仅社长可上传、编辑、删除；成员与教师只读（教师端独立视图）。\n· 埋点：上传打开、提交成功/失败、预览打开、管理点击、删除确认。\n· 异常：素材上传失败需保留已填文本并允许重试。", "anchor": {"selector": ".mgf-content"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.95}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "b7c20d74-5c6e-4f47-8b09-1d2e3f4a5b6e", "pageId": "manage-showcase", "stateId": "default", "number": 10, "body": "【G-10 与社团风采一致性】\n· 成果荣誉与社团详情「社团风采」同源，字段、排序、计数必须一致。\n· 上传/编辑/删除后，社团详情页与「我报名的」入口计数需同步更新。\n· 封面展示比例统一，列表内裁切填充，禁止拉伸变形。\n· 公开展示不等于教师审核，教师端不提供逐项通过/驳回操作。\n【待确认】同步为实时推送还是进入页面时拉取；是否需要展示「审核/备案」标识。", "anchor": {"selector": ".mgf-hero"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.02, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:30:00.000Z"}, {"id": "9b3c390b-424e-4cce-a496-f3ae873c1c07", "pageId": "club-gallery", "stateId": "default", "number": 1, "body": "【社团风采 tab】\n\n1. 两个子 tab：作品集锦 / 荣誉时刻，各自展示数量；切换不请求整页。\n2. 作品集锦卡片展示照片、标题、创作者、说明、上传时间；点击预览大图。\n3. 荣誉时刻展示照片、标题、获奖时间、上传时间；点击预览大图。\n4. 作品与荣誉由社长上传，学生只读。\n", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2) > div > nav > button:nth-of-type(2)", "tag": "button", "text": "社团风采", "parentText": "社团详情 社团风采", "htmlSnippet": "<button type=\"button\" class=\"active\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"13\" height=\"13\" fill=\"currentColor\" viewBox=\"0 0 256 256\"><path d=\"M239.18,97.26A16.38,16.38,0,0,0,224.92,86l-59-4.76L143.14,26.15a16.36,16.36,0,0,0-30.27,0L90.11,81.23,31.08,86a16.46,16.46,0,0,0-9.37,28.86l45,38.83L53,211.75a16.38,16.38,0,0,0,24.5,17.82L128,198.49l50.53,31.08A16.4,16.4,0,0,0,203,211.75l-13.76-58.07,45-38.83A16.43,16.43,0,0,0,239.18,97.26Zm-15.34,5.47-48.7,42a8,8,0,0,0-2.56,7.91l14.88,62.8a.37.37,0,0,1-.17.48c-.18.14-.23.11-.38,0l-54.72-33.65a8,8,0,0,0-8.38,0L69.09,215.94c-.15.09-.19.12-.38,0a.37.37,0,0,1-.17-.48l14.88-62.8a8,8,0,0,0-2.56-7.91l-48.7-42c-.12-.1-.23-.19-.13-.5s.18-.27.33-.29l63.92-5.16A8,8,0,0,0,103,91.86l24.62-59.61c.08-.17.11-.25.35-.25s.27.08.35.25L153,91.86a8,8,0,0,0,6.75,4.92l63.92,5.16c.15,0,.24,0,.33.29S224,102.63,223.84,102.73Z\"><\/path><\/svg>社团风采<\/button>", "rect": {"x": 348, "y": 373, "width": 102, "height": 46}, "conditions": [{"selector": "#root > div > main > section > div:nth-of-type(2) > div > div > div:nth-of-type(1) > div:nth-of-type(1) > button:nth-of-type(1)", "kind": "aria-selected", "value": "true", "option": "作品集锦 5", "label": "", "explicit": false}]}, "placement": {"kind": "element", "x": 75, "y": 28.8125, "rx": 0.7352941176470589, "ry": 0.626358695652174}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-04T07:41:05.520Z"}, {"id": "c3d1e2f4-5a6b-4c7d-8e9f-0a1b2c3d4e51", "pageId": "moment-wall", "stateId": "default", "number": 1, "body": "【M-01 页面定位与入口】\n· 页面=「我报名的 → 展开社团 → 活动卡片 → 活动精彩瞬间」，按单场活动维度展示，一个活动一个瞬间页，不跨活动聚合。\n· 另一入口：成员态「社团详情 → 活动瞬间」tab 的「去分享瞬间」。返回按来源回跳：mine→我报名的，detail→社团详情。\n· 权限：仅该社团正式成员可见；非成员或审核未通过需拦截并提示「加入社团后可查看」。\n· 本页数据需实时同步至社团详情「活动瞬间」tab 与「我报名的」活动卡片分享数。\n【待确认】活动结束或归档后是否仍允许发布新分享；历史学期是否只读。", "anchor": {"selector": ".fd-member-moment-hero"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.02, "ry": 0.02}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-04T03:40:00.000Z"}, {"id": "d4e2f3a5-6b7c-4d8e-9f0a-1b2c3d4e5f62", "pageId": "moment-wall", "stateId": "default", "number": 2, "body": "【M-02 顶部活动信息区】\n· 展示：社团名标签、活动名称、状态（待开展/已结束）、本人考勤标签、日期+周几+时间、地点、当前分享总数。\n· 考勤为「未开始」时不展示考勤标签；时间或地点缺失时统一兜底「以活动通知为准」。\n· 分享总数=该活动有效分享条数（含本人），发布/删除后实时刷新。\n· 「分享这一刻」按钮常驻右上角，不受滚动影响。\n【待确认】待开展活动是否允许提前分享；状态是否需要区分「进行中」。", "anchor": {"selector": ".fd-member-moment-meta"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-04T03:40:00.000Z"}, {"id": "e5f3a4b6-7c8d-4e9f-8a1b-2c3d4e5f6a73", "pageId": "moment-wall", "stateId": "default", "number": 3, "body": "【M-03 分享列表与排序】\n· 卡片流展示，默认按发布时间倒序（最新在前），不分页，滚动加载。\n· 卡片字段：作者、角色（社长/骨干/成员）、发布时间、正文、照片（1-3 张）或视频（1 段）、点赞数、评论数、精选标记、已编辑标记、「我的分享」标记。\n· 多图卡片支持卡片内左右切换，首张不显示「上一张」、末张不显示「下一张」，右上角展示「当前/总数」。\n· 正文为空时展示「分享了现场素材」，不占位；作者头像按姓名生成稳定色。\n【待确认】是否需要「精选优先 + 时间倒序」；单场活动分享条数上限。", "anchor": {"selector": ".moment-wall"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.02}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-04T03:40:00.000Z"}, {"id": "f6a4b5c7-8d9e-4f0a-9b2c-3d4e5f6a7b84", "pageId": "moment-wall", "stateId": "default", "number": 4, "body": "【M-04 发布分享（素材规则）】\n· 点击「分享这一刻」打开发布弹层；素材必填，正文选填（≤120 字）。\n· 照片最多 3 张，可一次多选、可逐张移除；视频仅 1 段；照片与视频不能混发（选视频自动清空照片，选照片自动清空视频）。\n· 无素材时发布按钮置灰不可提交；仅填文字不允许发布。\n· 发布成功：置顶插入，作者=当前登录成员，时间为当前时间，并同步社团详情；失败保留已选素材与正文。\n【待确认】视频时长/大小上限；是否允许 GIF；图片压缩与转码策略。", "anchor": {"selector": ".fd-member-moment-share"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-04T03:40:00.000Z"}, {"id": "a7b5c6d8-9e0f-4a1b-8c3d-4e5f6a7b8c95", "pageId": "moment-wall", "stateId": "default", "number": 5, "body": "【M-05 编辑与删除（仅本人）】\n· 仅「我的分享」展示更多菜单（编辑/删除），他人分享不提供任何写操作。\n· 编辑：可改正文、可移除已有照片；保存后标记「已编辑」，并同步更新卡片与预览弹窗。视频分享仅可改正文，不支持替换视频。\n· 删除：二次确认，明确提示会同时从社团详情「活动瞬间」移除，点赞与评论一并清空且不可恢复。\n· 删除后分享总数、评论数、点赞数同步更新；社长精选不改变作者的编辑/删除权限。\n【待确认】删除是否保留回收站/可恢复；编辑是否保留历史版本。", "anchor": {"selector": ".moment-tile"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.95, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-04T03:40:00.000Z"}, {"id": "b8c6d7e9-0f1a-4b2c-9d4e-5f6a7b8c9d06", "pageId": "moment-wall", "stateId": "default", "number": 6, "body": "【M-06 预览弹窗】\n· 点击卡片素材或评论数打开两栏预览：左侧素材，右侧作者信息、正文、点赞与评论。\n· 多图支持左右切换、序号与缩略图定位；视频展示播放控件。\n· 评论区展示评论人、角色、时间、内容；空态「还没有评论，来说第一句吧」；输入 ≤100 字，Enter 或「发送」提交。\n· 本人分享在预览内提供编辑/删除；精选与「已编辑」标记需在预览中可见。\n【待确认】评论是否支持删除/回复；评论是否需要审核后可见。", "anchor": {"selector": ".moment-tile-media"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-04T03:40:00.000Z"}, {"id": "c9d7e8f0-1a2b-4c3d-8e5f-6a7b8c9d0e17", "pageId": "moment-wall", "stateId": "default", "number": 7, "body": "【M-07 点赞与评论规则】\n· 点赞为切换态，每人每条一次；取消点赞减 1，计数不得出现负数。\n· 评论按时间正序展示，提交后追加到末尾，并同步更新卡片评论数。\n· 评论内容去首尾空格，空内容不提交；提交成功后清空输入框。\n· 同一用户重复点击需防抖/幂等，避免重复计数或重复评论。\n【待确认】点赞/评论是否计入社团活跃度或社团报告数据。", "anchor": {"selector": ".moment-tile-body"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-04T03:40:00.000Z"}, {"id": "d0e8f9a1-2b3c-4d4e-9f6a-7b8c9d0e1f28", "pageId": "moment-wall", "stateId": "default", "number": 8, "body": "【M-08 精选展示规则】\n· 精选由社长在「我管理的 → 社团活动 → 活动瞬间」设置，成员端只读展示「精选」角标，不提供设置入口。\n· 精选当前不改变排序权重，列表仍按发布时间倒序；若需优先展示需明确排序规则。\n· 社长精选/取消精选后，成员端刷新可见状态变化。\n【待确认】精选是否在列表内置顶；每场活动的精选数量上限。", "anchor": {"selector": ".moment-tile"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.02}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-04T03:40:00.000Z"}, {"id": "e1f9a0b2-3c4d-4e5f-8a7b-8c9d0e1f2a39", "pageId": "moment-wall", "stateId": "default", "number": 9, "body": "【M-09 空态与异常】\n· 无分享：展示空态「还没有人分享活动瞬间」，并引导上传第一份素材。\n· 素材上传失败或发布失败：保留已选素材与正文，提示重试，禁止静默关闭。\n· 网络异常时保留上次数据并提示刷新，不展示空白页。\n· 素材失效时展示占位图，避免破图影响浏览。\n【待确认】图片加载失败的占位样式与重试策略。", "anchor": {"selector": ".moment-wall"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.95}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-04T03:40:00.000Z"}, {"id": "f2a0b1c3-4d5e-4f6a-9b8c-9d0e1f2a3b40", "pageId": "moment-wall", "stateId": "default", "number": 10, "body": "【M-10 权限、同步与埋点】\n· 访问权限：仅本社团正式成员；社长沿用成员身份可发布，同时拥有精选权限。\n· 数据同步：本页新增/编辑/删除需同步「社团详情 → 活动瞬间」tab、「我报名的」活动卡片分享数、「我管理的」活动瞬间页。\n· 历史学期只读：禁止发布、编辑、删除，仅可浏览。\n· 埋点：进入页面、发布打开/成功/失败、点赞、评论提交、编辑保存、删除确认/取消、素材切换。", "anchor": {"selector": ".fd-member-moment-hero"}, "placement": {"kind": "element", "x": 1, "y": 1, "rx": 0.5, "ry": 0.95}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-04T03:40:00.000Z"}], "prototypeVersions": {"entries/applications.html": "c1e799168e31dff4d707", "entries/club-detail.html": "6d9a356c495143bd014c", "entries/club-gallery.html": "9cad776190cb0d39ae99", "entries/declaration-form.html": "eb3a1c184ef503c0733d", "entries/drafts.html": "e135cac33346888dac9e", "entries/manage-activities.html": "a5e8593a766c4053a444", "entries/manage-credits.html": "e5d0448dbdb7080f93eb", "entries/manage-members.html": "dba80a5a93f7bf3e556a", "entries/manage-publish.html": "f3e2c7d425fceb9bfe42", "entries/manage-renew.html": "091503ec13aa14cc8859", "entries/manage-showcase.html": "c3ad6a2fd677daa204b4", "entries/manage.html": "22f306ac71b031a36ecb", "entries/mine.html": "7516482f97af23f03dca", "entries/moment-wall.html": "b7a76052108a14f0cd3b", "entries/plaza.html": "cbd5a59bac88e150ad99", "entries/report.html": "7b963e2330e54f06d22f", "pages/entries/applications.html": "ab12c9ce2f6f0f23b130", "pages/entries/club-detail.html": "7580663f1468b550320a", "pages/entries/club-gallery.html": "df6775c17d48e0a35ca9", "pages/entries/declaration-form.html": "1374d9a4ddfab488fb34", "pages/entries/drafts.html": "89ca7c98cf58e994ab07", "pages/entries/manage-activities.html": "b6916873fc83b73a8d4d", "pages/entries/manage-credits.html": "64428869756fad9970f9", "pages/entries/manage-members.html": "62bdfa404b756aa8adb8", "pages/entries/manage-publish.html": "b8f98b1169cc12147912", "pages/entries/manage-renew.html": "eb56835988fedd9076b3", "pages/entries/manage-showcase.html": "c190e64020c25dceb19e", "pages/entries/manage.html": "9352e7a448cd8b915d87", "pages/entries/mine.html": "74634521e4d512ddfdec", "pages/entries/moment-wall.html": "26ae6b90c80de1f5d80d", "pages/entries/plaza.html": "47a6f7db5c081cefa90c", "pages/entries/report.html": "8e35c81c321ca12838a7", "pages/index.html": "bf7b6ae7726ee7b33d6c"}}</script>
        <script>
            'use strict';
            const $ = (id) => document.getElementById(id);
            /* 壳与原型 iframe 走 postMessage（气泡三脚本已由导出流程内嵌进每个原型页）：
               不跨文档读写 iframe，所以 ZIP 解压后 file:// 双击打开（每个文件独立源）与 GitHub Pages 同样可用。 */

            // ---------- 零依赖精简 Markdown 渲染器（先转义再变换，禁原始 HTML） ----------
            function esc(s) {
                return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
            function inline(s) {
                const literals = [];
                const hold = html => { literals.push(html); return '\u0000' + (literals.length - 1) + '\u0000'; };
                return esc(s)
                    .replace(/`([^`]+)`/g, (m, code) => hold(`<code>${code}</code>`))
                    .replace(/!\[([^\]]*)\]\((prd-assets\/[a-f0-9]{64}\.(?:png|jpg|gif|webp))(?:\s+&quot;([^\n]*?)&quot;)?\)/g, (m, alt, path, title = '') => {
                        const size = /(?:^|\s)proto-width=(\d{1,4})$/.exec(title);
                        const width = size && +size[1] >= 48 && +size[1] <= 4096 ? ` width="${+size[1]}"` : '';
                        if (width) title = title.slice(0, size.index).trim();
                        return hold(`<img src="${esc(new URL('proto/' + path, location.href).href)}" alt="${alt}"${width}${title ? ` title="${title}"` : ''} loading="lazy">`);
                    })
                    // 文字颜色：与工作台 safeHTML 同口径，只放行 <span style="color:…"> 这一种内联 HTML（色值限十六进制 / 颜色名）
                    .replace(/&lt;span style=&quot;color:(#[0-9a-fA-F]{3,8}|[a-zA-Z]+)&quot;&gt;/g, (m, c) => `<span style="color:${c.toLowerCase()}">`)
                    .replace(/&lt;\/span&gt;/g, '</span>')
                    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
                    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
                    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) =>
                        /^(https?:|mailto:|#)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t)
                    .replace(/\u0000(\d+)\u0000/g, (m, index) => literals[+index]);
            }
            function md(src) {
                const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
                const out = [];
                let i = 0, para = [];
                const flushPara = () => {
                    if (para.length) { out.push(`<p>${para.map(inline).join('<br>')}</p>`); para = []; }
                };
                while (i < lines.length) {
                    const line = lines[i];
                    let m = line.match(/^```\w*\s*$/);
                    if (m) {
                        flushPara();
                        const buf = [];
                        i++;
                        while (i < lines.length && !/^```\s*$/.test(lines[i])) buf.push(lines[i++]);
                        i++;
                        out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
                        continue;
                    }
                    if (/^\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1]) && lines[i + 1].includes('-')) {
                        flushPara();
                        const parseRow = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
                        const head = parseRow(line);
                        i += 2;
                        const rows = [];
                        while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) rows.push(parseRow(lines[i++]));
                        out.push(`<table><thead><tr>${head.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
                        continue;
                    }
                    m = line.match(/^(#{1,4})\s+(.*)$/);
                    if (m) { flushPara(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
                    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); out.push('<hr>'); i++; continue; }
                    if (/^>\s?/.test(line)) {
                        flushPara();
                        const buf = [];
                        while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
                        out.push(`<blockquote>${md(buf.join('\n'))}</blockquote>`);
                        continue;
                    }
                    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
                        flushPara();
                        const ordered = /^\s*\d+\./.test(line);
                        const itemRe = ordered ? /^\s*\d+\.\s+(.*)$/ : /^\s*[-*+]\s+(.*)$/;
                        const items = [];
                        while (i < lines.length && itemRe.test(lines[i])) {
                            const t = lines[i].match(itemRe)[1];
                            i++;
                            const task = t.match(/^\[([ xX])\]\s+(.*)$/);
                            items.push(task
                                ? `<li class="task"><input type="checkbox" disabled${task[1] !== ' ' ? ' checked' : ''}> ${inline(task[2])}</li>`
                                : `<li>${inline(t)}</li>`);
                        }
                        out.push(ordered ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`);
                        continue;
                    }
                    if (!line.trim()) { flushPara(); i++; continue; }
                    para.push(line);
                    i++;
                }
                flushPara();
                return out.join('\n');
            }

            // ---------- 数据与状态 ----------
            let data = null;
            try { data = JSON.parse($('review-data').textContent); } catch (_) { data = null; }
            const frame = $('frame');
            let current = { page: null, stateId: null };
            let orders = {};            // stateId -> { map: noteId -> displayNumber, stale: Set }
            let pendingState = null;    // 跨页切换时，等原型页报 ready 后再进入的状态
            let loadedFile = null;
            let frameReady = false;     // 当前 iframe 页已握手（收到 ready 且已下发 init）
            let projectNavigation = null;
            let selectedNoteId = null;

            const safePath = (path) => {
                const parts = String(path || '').replace(/\\/g, '/').split('/');
                if (parts.some((p) => !p || p.startsWith('.') || p.includes(':'))) throw new Error('原型文件路径无效');
                return parts.map(encodeURIComponent).join('/');
            };
            function prototypeUrl(page) {
                const file = String(page.file || '').replace(/\\/g, '/');
                const path = 'proto/' + safePath(file);
                const version = data.prototypeVersions?.[file];
                return typeof version === 'string' && /^[a-f0-9]{20}$/.test(version) ? path + '?v=' + version : path;
            }

            /* file:// 下 iframe 源为 opaque（'null'），targetOrigin 只能用 '*'；接收侧以 e.source === frame.contentWindow 校验。 */
            function post(msg) {
                try { frame.contentWindow?.postMessage(Object.assign({ __review: 1 }, msg), '*'); } catch (_) { /* iframe 未就绪 */ }
            }

            const canvas = document.querySelector('.canvas');
            let hotspotPointer = null;
            canvas.addEventListener('pointerdown', e => { hotspotPointer = { x: e.clientX, y: e.clientY, moved: false }; }, true);
            canvas.addEventListener('pointermove', e => {
                if (hotspotPointer && Math.hypot(e.clientX - hotspotPointer.x, e.clientY - hotspotPointer.y) > 8) hotspotPointer.moved = true;
            }, true);
            canvas.addEventListener('pointercancel', () => { hotspotPointer = null; }, true);
            canvas.addEventListener('click', e => {
                const drag = hotspotPointer?.moved; hotspotPointer = null;
                if (drag || !frameReady || e.defaultPrevented || e.button !== 0 || e.detail === 0 || e.target.closest('button,a,input,textarea,select,[contenteditable],[data-prototype-owned]') || String(getSelection()).trim()) return;
                post({ type: 'showHotspots' });
            });

            // ---------- 左栏页面树 ----------
            function buildTree() {
                const config={project:data,currentPage:current.page?.id,currentState:current.stateId,annotations:data.annotations,
                    onSelect:(id,state)=>selectPage(data.pages.find(p=>p.id===id),state)};
                if(projectNavigation)projectNavigation.update(config);
                else projectNavigation=ProtoProjectNavigation.mount($('tree'),config);
            }
            function treeButton(text, page, stateId) {
                const b = document.createElement('button');
                b.textContent = text;
                b.dataset.scope = page.id + '\n' + stateId;
                b.onclick = () => selectPage(page, stateId);
                return b;
            }

            // ---------- 页面 / 状态切换 ----------
            function selectPage(page, stateId) {
                const samePage = current.page?.id === page.id && loadedFile === page.file;
                if (current.page?.id !== page.id || current.stateId !== stateId) selectedNoteId = null;
                current = { page, stateId };
                buildTree();
                ProtoProjectNavigation.applyPreview(frame,page.states?.find(s=>s.id===stateId)?.previewType || page.previewType || data.clients?.find(c=>c.id===page.clientId)?.previewType || data.previewType || 'web');
                if (!samePage) orders = {};
                syncChrome();
                renderAside();
                if (samePage && frameReady) {
                    post({ type: 'enterState', stateId });
                } else {
                    pendingState = stateId;
                    loadedFile = page.file;
                    frameReady = false;
                    frame.hidden = false;
                    $('empty').hidden = true;
                    frame.src = prototypeUrl(page);
                }
            }
            function syncChrome() {
                const { page, stateId } = current;
                const st = page.states?.find((s) => s.id === stateId);
                $('scope').textContent = (page.states?.length || 0) > 1 ? `${page.title} / ${st?.title || stateId}` : page.title;
                try { $('source').href = prototypeUrl(page); } catch (_) { $('source').removeAttribute('href'); }
                for (const b of $('tree').querySelectorAll('button'))
                    b.setAttribute('aria-current', String(b.dataset.scope === page.id + '\n' + stateId));
                history.replaceState(null, '', '#' + new URLSearchParams({ p: page.id, s: stateId }).toString());
            }

            // ---------- 原型页握手：页内 bridge 报 ready 后下发标注，跟随真实页面 / 状态 ----------
            const pageNotes = () => data.annotations
                .filter((n) => n.pageId === current.page.id)
                .map((n) => Object.assign({}, n, { bodyHtml: md((n.body || '').trim() ? n.body : '*（空标注）*') }));
            function onFrameReady(ids) {
                if (!current.page || !loadedFile) return;
                const actual = data.pages.find((p) => p.id === ids.pageId);
                if (actual && actual.id !== current.page.id) {
                    /* 原型内部导航到了另一个已登记页面：跟随。 */
                    current = { page: actual, stateId: actual.states.some((s) => s.id === ids.stateId) ? ids.stateId : actual.states[0].id };
                    selectedNoteId = null;
                    orders = {};
                    pendingState = null;
                    syncChrome();
                } else if (ids.stateId && ids.stateId !== current.stateId && current.page.states?.some((s) => s.id === ids.stateId)) {
                    current.stateId = ids.stateId;
                    selectedNoteId = null;
                    syncChrome();
                }
                let enterState = null;
                if (pendingState) {
                    if (pendingState !== (ids.stateId || 'default')) enterState = pendingState;
                    pendingState = null;
                }
                frameReady = true;
                // 先按当前页/状态判定 PRD 是否为空，再把真实侧栏开合态下发给 iframe；避免切页瞬间沿用上一页状态。
                renderAside();
                post({ type: 'init', notes: pageNotes(), asideOpen: prdAsideOpen(), enterState, selectedNoteId,
                    hintScopes: (current.page?.states || []).map(state => ({id: state.id, interactionHints: state.interactionHints})) });
            }
            window.addEventListener('message', (e) => {
                if (e.source === frame.contentWindow && e.data?.__protoScreenshot === 1 && e.data.type === 'navigate' && current.page?.kind === 'screenshot') {
                    const target = data.pages.find(p => p.id === e.data.pageId);
                    if(target) selectPage(target, target.states[0]?.id || 'default');
                    return;
                }
                if (e.source !== frame.contentWindow || !e.data || e.data.__review !== 1) return;
                const m = e.data;
                if (m.type === 'ready') { onFrameReady(m.ids || {}); return; }
                if (!frameReady) return;   // 握手前的空 sync 丢掉，免右栏闪一下“–”
                if (m.type === 'sync') onPinSync(m.map || {}, m.state || 'default', m.stale || []);
                else if (m.type === 'focus') onPinFocus(m.noteId);
                else if (m.type === 'selection') selectReviewNote(m.noteId);
            });

            // ---------- 气泡层回调 ----------
            function onPinSync(map, state, stale) {
                orders[state] = { map, stale: new Set(stale) };
                if (current.page && state !== current.stateId && current.page.states?.some((s) => s.id === state)) {
                    /* 原型自身切换了状态（页内交互）：右栏与页面树跟随。 */
                    current.stateId = state;
                    selectedNoteId = null;
                    syncChrome();
                }
                if (state === current.stateId) renderAside();
            }
            function onPinFocus(noteId) {
                selectReviewNote(noteId);
                const row = $('notes').querySelector(`[data-note-id="${CSS.escape(noteId)}"]`);
                if (!row) return;
                // 与 viewer extScrollNoteIntoView 同语义（单套同源）：定位行首（序号）进视口，行首已可见则不滚。
                // scrollIntoView({block:'nearest'}) 对「比滚动容器高且正覆盖视口」的长标注是规范 no-op，长文标注停在视口中部时点序号不滚动（2026-09-30 用户报障）。
                const sc = row.closest('aside');
                const top = row.getBoundingClientRect().top - sc.getBoundingClientRect().top;
                if (top < 0 || top >= sc.clientHeight) sc.scrollTo({ top: sc.scrollTop + top - 12, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
                row.classList.remove('flash');
                void row.offsetWidth;
                row.classList.add('flash');
            }
            function reveal(note) {
                // 定位在原型页内完成（review-bridge.js：目标被折叠隐藏时先联动展开再滚到位）
                selectReviewNote(note.id);
                post({ type: 'reveal', note });
            }
            function selectReviewNote(noteId) {
                selectedNoteId = data.annotations.some(n => n.id === noteId && n.pageId === current.page?.id && n.stateId === current.stateId) ? noteId : null;
                for (const row of $('notes').querySelectorAll('.note')) {
                    const selected = row.dataset.noteId === selectedNoteId;
                    row.classList.toggle('selected', selected);
                    row.setAttribute('aria-current', String(selected));
                }
                post({ type: 'select', noteId: selectedNoteId });
            }

            // ---------- 右栏 PRD ----------
            const prdAsideOpen = () => !$('layout').classList.contains('right-closed') && !$('layout').classList.contains('prd-empty');
            function renderAside() {
                const { page, stateId } = current;
                if (!page) return;
                const doc = data.documents.find((d) => d.pageId === page.id && d.stateId === stateId);
                const docHasContent = !!doc?.markdown?.trim();
                $('document-section').hidden = !docHasContent;
                $('document').innerHTML = docHasContent ? md(doc.markdown) : '';
                const notes = data.annotations.filter((n) => n.pageId === page.id && n.stateId === stateId);
                const notesHasContent = notes.length > 0;
                $('notes-section').hidden = !notesHasContent;
                $('notes-count').textContent = notesHasContent ? `（${notes.length}）` : '';
                const prdEmpty = !docHasContent && !notesHasContent;
                $('layout').classList.toggle('prd-empty', prdEmpty);
                $('toggle-prd').hidden = prdEmpty;
                // 切换页面时 renderAside 可能先于新 iframe 加载；只向当前已握手文件同步，避免把新页状态误发给旧 iframe。
                if (frameReady && current.page?.file === loadedFile)
                    post({ type: 'aside', open: !prdEmpty && !$('layout').classList.contains('right-closed') });
                const cache = orders[stateId];
                let rows;
                if (cache) {
                    const pos = (n) => (cache.map[n.id] ?? 1e9);
                    const byPos = (a, b) => pos(a) - pos(b) || a.number - b.number;
                    rows = [
                        ...notes.filter((n) => !cache.stale.has(n.id)).sort(byPos).map((n) => [n, cache.map[n.id] ?? '–', false]),
                        ...notes.filter((n) => cache.stale.has(n.id)).sort(byPos).map((n) => [n, cache.map[n.id] ?? '–', true]),
                    ];
                } else {
                    rows = notes.slice().sort((a, b) => a.number - b.number).map((n) => [n, n.number, false]);
                }
                const host = $('notes');
                host.replaceChildren();
                for (const [note, num, stale] of rows) {
                    const row = document.createElement('section');
                    row.className = 'note' + (stale ? ' stale' : '') + (note.id === selectedNoteId ? ' selected' : '');
                    row.dataset.noteId = note.id;
                    row.setAttribute('aria-current', String(note.id === selectedNoteId));
                    row.tabIndex = 0;
                    row.setAttribute('aria-label', `标注 ${num}${stale ? '，已失锚' : '，回车定位到原型位置'}`);
                    const no = document.createElement('span');
                    no.className = 'note-no';
                    no.textContent = num;
                    no.setAttribute('aria-hidden', 'true');
                    const customColor = /^#[0-9a-f]{6}$/i.test(note.color || '') ? note.color : null;
                    if (customColor && !stale) { no.style.setProperty('--pin-fill', customColor); no.style.setProperty('--pin-ink', 'var(--pin-custom-ink)'); }
                    if (stale) row.title = '标注已失锚：原型中找不到对应元素';
                    const body = document.createElement('div');
                    body.className = 'markdown';
                    body.innerHTML = md(note.body || '');
                    const head = document.createElement('div');
                    head.className = 'note-head';
                    head.append(no);
                    row.append(head, body);
                    if (!stale) {
                        row.onclick = () => reveal(note);
                        row.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); reveal(note); } };
                    }
                    host.append(row);
                }
            }

            // ---------- 启动 ----------
            if (!data?.pages?.length) {
                $('empty').textContent = '评审数据缺失或无效，请重新发布。';
            } else {
                $('project').textContent = data.name || '原型项目';
                document.title = `${data.name || '原型项目'} · 原型评审`;
                $('generated').textContent = data.publishedAt ? '发布于 ' + String(data.publishedAt).slice(0, 16).replace('T', ' ') : '';
                buildTree();
                const params = new URLSearchParams(location.hash.slice(1));
                const page = data.pages.find((p) => p.id === params.get('p')) || ProtoProjectNavigation.defaultPage(data);
                const stateId = page.states?.some((s) => s.id === params.get('s')) ? params.get('s') : (page.states?.[0]?.id || 'default');
                selectPage(page, stateId);
            }
            const pageNavSizer = ProtoSidebarResize.attach($('page-nav-resizer'), {
                storageKey: 'prototype-page-nav-width', isOpen: () => !$('layout').classList.contains('left-closed'),
                getMax: () => $('layout').clientWidth - document.querySelector('aside').getBoundingClientRect().width - 240,
                setWidth: width => $('layout').style.setProperty('--page-nav-width', width + 'px')
            });
            $('toggle-pages').onclick = () => { $('layout').classList.toggle('left-closed'); pageNavSizer.refresh(); };
            /* PRD 宽度：拖拽调节 + localStorage 记忆；收起时清除内联宽度让 --right 归 0。 */
            const PRD_KEY = 'proto-review-prd-width';
            const applyPrdWidth = () => {
                const w = parseInt(localStorage.getItem(PRD_KEY) || '0', 10);
                if (w >= 280) $('layout').style.setProperty('--right', Math.min(w, 720) + 'px');
            };
            applyPrdWidth();
            $('toggle-prd').onclick = () => {
                const closed = $('layout').classList.toggle('right-closed');
                $('toggle-prd').textContent = closed ? '显示 PRD' : '收起 PRD';
                if (closed) $('layout').style.removeProperty('--right');
                else applyPrdWidth();
                pageNavSizer.refresh();
                post({ type: 'aside', open: !closed });
                // 与 viewer 同源（约定 11/12）：收起态开的序号 popover，展开右栏时迁移为右栏定位——关 popover + 行首定位 + 高亮。
                if (!closed) {
                    let openPopId = null;
                    try { openPopId = frame.contentWindow?.__reviewPopNoteId?.(); } catch (_) { /* 未握手 */ }
                    if (openPopId) { try { frame.contentWindow?.__reviewHidePop?.(); } catch (_) { /* 未握手 */ } onPinFocus(openPopId); }
                }
            };
            const prdResizer = $('prd-resizer');
            prdResizer.addEventListener('pointerdown', (e) => {
                if ($('layout').classList.contains('right-closed')) return;
                e.preventDefault();
                prdResizer.setPointerCapture(e.pointerId);
                prdResizer.classList.add('resizing');
                const startX = e.clientX, startWidth = document.querySelector('aside').offsetWidth;
                const move = (ev) => $('layout').style.setProperty('--right', Math.max(280, Math.min(startWidth + (startX - ev.clientX), 720)) + 'px');
                const up = () => {
                    prdResizer.removeEventListener('pointermove', move);
                    prdResizer.removeEventListener('pointerup', up);
                    prdResizer.classList.remove('resizing');
                    pageNavSizer.refresh();
                    const w = parseInt($('layout').style.getPropertyValue('--right'), 10);
                    if (w >= 280) { try { localStorage.setItem(PRD_KEY, String(w)); } catch (_) { /* 存储异常忽略 */ } }
                };
                prdResizer.addEventListener('pointermove', move);
                prdResizer.addEventListener('pointerup', up);
            });
        </script>
    </body>
</html>
