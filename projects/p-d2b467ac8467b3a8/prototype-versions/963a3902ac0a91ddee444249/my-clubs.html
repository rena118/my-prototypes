          '<h3>' + club.name + '<span class="tag tag-cat">' + club.category + '</span></h3>' +
          '<div class="joined-meta">' +
            '<span>社长：' + club.leader + '</span>' +
            '<span>加入于 ' + club.joinedAt + '</span>' +
            '<span>出勤 ' + club.attendance + '</span>' +
            '<span>累计 ' + club.hours + '</span>' +
          '</div>' +
          '<div class="joined-next">' +
            '<strong>下一场活动</strong>' +
            (next
              ? '<span>' + next.title + '</span><span>' + next.day + ' ' + next.week + ' · ' + next.time + ' · ' + next.venue + '</span>'
              : '<span>暂未发布</span>') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="joined-actions">' +
        creditButton(club) +
        '<button type="button" class="mini-btn ghost" data-act="club:view" data-id="' + club.id + '">查看社团</button>' +
        '<button type="button" class="mini-btn ghost" data-act="club:expand" data-id="' + club.id + '">' + (open ? '收起' : '展开') + '</button>' +
      '</div>' +
      '<button type="button" class="showcase-entry ' + (club.hasGallery ? 'has-content' : 'is-empty') + '" data-act="club:showcase" data-id="' + club.id + '">' +
        '<span class="showcase-entry-icon">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4.6h8v3.2a4 4 0 0 1-8 0V4.6Z"/><path d="M8 6H5.4v1.6A3 3 0 0 0 8.4 10.6"/><path d="M16 6h2.6v1.6a3 3 0 0 1-3 3"/><path d="M12 11.8v3.4"/><path d="M9 19.4h6"/><path d="M10.4 15.2h3.2v4.2h-3.2z"/></svg>' +
        '</span>' +
        '<span class="showcase-entry-main">' +
          '<strong>社团成果荣誉</strong>' +
          '<small>' + (club.hasGallery ? club.works + ' 件作品 ｜ ' + club.honors + ' 项荣誉' : '社长还未上传作品与荣誉') + '</small>' +
        '</span>' +
        '<em>查看' +
          '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>' +
        '</em>' +
      '</button>' +
      activityHtml +
    '</article>';
  }

  function mineHtml() {
    var pending = MINE.pending;
    var noticeHtml = '';
    if (state.pendingWithdrawn) {
      noticeHtml = '<div class="notice-bar is-row is-neutral">' +
        '<span class="notice-dot"></span>' +
        '<div class="notice-main"><strong>已取消「' + pending.name + '」的报名申请</strong><span>如需再报名，可重新提交申请</span></div>' +
      '</div>';
    } else {
      noticeHtml = '<div class="notice-bar is-row">' +
        '<span class="notice-dot"></span>' +
        '<div class="notice-main"><strong>1 个报名申请待社长审核</strong><span>' + pending.name + '</span></div>' +
        '<button type="button" class="notice-link" data-act="pending:toggle">' + (state.pendingOpen ? '收起' : '查看申请') +
          '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" class="' + (state.pendingOpen ? 'rotated' : '') + '"><path d="m6 9 6 6 6-6"/></svg>' +
        '</button>' +
      '</div>';
      if (state.pendingOpen) {
        noticeHtml += '<article class="app-row">' +
          '<span class="app-cover" style="background-image:url(\'' + pending.cover + '\')"></span>' +
          '<div class="app-main">' +
            '<h3>' + pending.name + '<span class="tag tag-cat">' + pending.category + '</span></h3>' +
            '<p>提交于 ' + pending.submittedAt + '</p>' +
            '<span class="app-reason">申请说明：' + pending.reason + '</span>' +
          '</div>' +
          '<button type="button" class="app-cancel" data-act="pending:cancel">取消报名</button>' +
        '</article>';
      }
    }

    return '<div class="seg-control">' +
        '<button type="button" class="active" data-act="tab:joined">我报名的</button>' +
        '<button type="button" data-act="tab:managed">我管理的</button>' +
      '</div>' +
      '<button type="button" class="mine-term" data-act="pick" data-kind="mineTerm">' + state.mineTerm +
        '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
      '</button>' +
      noticeHtml +
      '<div class="section-title"><h2>已加入的社团</h2><span>' + MINE.joined.length + ' 个</span></div>' +
      MINE.joined.map(joinedCard).join('');
  }

  /* ---------- 我管理的 ---------- */
  function membersHtml(club) {
    var keyword = state.memberKeyword.trim();
    var list = club.members.filter(function (member) {
      return !keyword || (member.name + member.cls + member.role + member.phone).indexOf(keyword) !== -1;
    });
    if (!list.length) {
      return '<div class="empty-mini"><strong>没有找到包含“' + keyword + '”的成员</strong><button type="button" data-act="member:clear">清空搜索条件</button></div>';
    }
    var fullTarget = state.manageClub === 'documentary' ? 4 : 6;
    return list.map(function (member) {
      return '<div class="member-row">' +
        '<span class="member-avatar">' + member.name.charAt(0) + '</span>' +
        '<div class="member-main">' +
          '<h4>' + member.name + '<span class="role-pill ' + (member.role === '社长' ? 'leader' : '') + '">' + member.role + '</span></h4>' +
          '<p>' + member.cls + ' · 加入于 ' + member.join + '</p>' +
          '<p>活动出勤 ' + (member.count > 0 ? member.count + ' 场' : '新加入') +
            (member.count >= fullTarget && member.count > 0 ? '<span class="full-tag">全勤</span>' : '') +
            ' · ' + member.phone + '</p>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function membersTab(club) {
    return '<div class="applicant-banner">' +
        '<div><span class="banner-badge">新入团申请</span>' +
          '<p>有 <strong>' + club.applicants.length + '</strong> 位同学申请加入社团，待你审核</p>' +
        '</div>' +
        '<button type="button" data-act="applicant:review" data-index="0">去审核（' + club.applicants.length + '）›</button>' +
      '</div>' +
      '<label class="mp-search member-search">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.4 4.4"/></svg>' +
        '<input type="text" id="memberSearch" placeholder="搜索成员姓名、班级或联系电话" value="' + state.memberKeyword + '" autocomplete="off" />' +
      '</label>' +
      '<div class="member-toolbar">' +
        '<span class="members-count">当前成员 <strong>' + club.members.length + '</strong> / ' + club.capacity + ' 人</span>' +
        '<div class="member-tools">' +
          '<button type="button" data-act="history:open">入团申请记录（' + club.history.length + '）</button>' +
          '<button type="button" data-act="members:export">导出成员名单</button>' +
        '</div>' +
      '</div>' +
      '<div class="member-list" id="memberList">' + membersHtml(club) + '</div>';
  }

  function activityStateClass(value) {
    if (value === '待开展') return 'upcoming';
    if (value === '进行中') return 'ongoing';
    return 'ended';
  }

  function attendanceDone(activity) {
    if (activity.attendanceDone != null) return activity.attendanceDone;
    return activity.state !== '待开展' && activity.attendance.indexOf('待') === -1 && activity.attendance.indexOf('应到') === -1;
  }

  function recordDone(activity) {
    if (activity.recordDone != null) return activity.recordDone;
    return activity.record === '已填活动记录';
  }

  function activitiesTab(club) {
    var filters = [
      { key: 'all', label: '全部', count: club.activities.length },
      { key: '进行中', label: '进行中', count: club.activities.filter(function (a) { return a.state === '进行中'; }).length },
      { key: '待开展', label: '待开展', count: club.activities.filter(function (a) { return a.state === '待开展'; }).length },
      { key: '已结束', label: '已结束', count: club.activities.filter(function (a) { return a.state === '已结束'; }).length }
    ];
    var list = state.activityFilter === 'all' ? club.activities : club.activities.filter(function (a) { return a.state === state.activityFilter; });
    var listHtml = list.map(function (activity, index) {
      var realIndex = club.activities.indexOf(activity);
      var isUpcoming = activity.state === '待开展';
      var needAttendance = !isUpcoming && !attendanceDone(activity);
      var needRecord = !isUpcoming && attendanceDone(activity) && !recordDone(activity);
      var primaryAction = '';
      if (needAttendance) {
        primaryAction = '<button type="button" class="mini-btn primary" data-act="activity:attendance" data-index="' + realIndex + '">考勤点名</button>';
      } else if (needRecord) {
        primaryAction = '<button type="button" class="mini-btn primary" data-act="activity:record" data-index="' + realIndex + '">填写活动记录</button>';
      }
      return '<article class="m-activity">' +
        '<div class="m-activity-head">' +
          '<span class="date-chip"><strong>' + activity.day + '</strong><span>' + activity.week + '</span></span>' +
          '<div class="m-activity-title">' +
            '<h4>' + activity.title + '</h4>' +
            '<p>' + activity.time + ' · ' + activity.venue + '</p>' +
          '</div>' +
          '<em class="state-em ' + activityStateClass(activity.state) + '">' + activity.state + '</em>' +
        '</div>' +
        '<p class="m-activity-desc">' + activity.desc + '</p>' +
        '<div class="m-activity-meta">' +
          '<span>' + activity.attendance + '</span>' +
          '<span class="' + (activity.record === '未填活动记录' ? 'warn' : '') + '">' + activity.record + '</span>' +
        '</div>' +
        (activity.attachment ? '<div class="m-activity-file"><span>PDF</span><small>' + activity.attachment + '</small></div>' : '') +
        '<div class="m-activity-ops">' +
          primaryAction +
          '<button type="button" class="mini-btn ghost" data-act="activity:detail" data-index="' + realIndex + '">查看详情</button>' +
          '<button type="button" class="mini-btn ghost" data-act="activity:more" data-index="' + realIndex + '">更多</button>' +
        '</div>' +
      '</article>';
    }).join('');
    if (!listHtml) listHtml = '<div class="empty-mini"><strong>该状态下暂无活动</strong></div>';

    return '<div class="filter-pills">' + filters.map(function (item) {
        return '<button type="button" class="' + (state.activityFilter === item.key ? 'active' : '') + '" data-act="activity:filter" data-filter="' + item.key + '">' + item.label + '（' + item.count + '）</button>';
      }).join('') +
      '<button type="button" class="pills-link" data-act="activity:allMoments">全部瞬间</button>' +
    '</div>' +
    '<div class="m-activity-list">' + listHtml + '</div>';
  }

  function showcaseTab(club) {
    var data = club.showcase;
    var items = state.showcaseTab === 'works' ? data.works : data.honors;
    var isWorks = state.showcaseTab === 'works';
    return '<div class="manage-actions">' +
        '<button type="button" class="manage-action primary" data-act="showcase:add"' + (isArchived() ? ' disabled' : '') + '>' +
          (isWorks ? '上传作品' : '登记荣誉') +
        '</button>' +
      '</div>' +
      '<div class="showcase-tabs">' +
        '<button type="button" class="' + (isWorks ? 'active' : '') + '" data-act="showcase:tab" data-tab="works">作品集锦 <span>' + data.works.length + '</span></button>' +
        '<button type="button" class="' + (!isWorks ? 'active' : '') + '" data-act="showcase:tab" data-tab="honors">荣誉时刻 <span>' + data.honors.length + '</span></button>' +
      '</div>' +
      '<div class="showcase-list">' + items.map(function (item) {
        return '<article class="showcase-card">' +
          '<img src="' + item.image + '" alt="' + item.title + '" />' +
          '<div class="showcase-card-body">' +
            '<h3>' + item.title + '</h3>' +
            '<p>' + (isWorks ? '创作者：' + item.creator : '获奖时间：' + item.time) + '</p>' +
            '<p>' + item.desc + '</p>' +
            '<small>社长上传 · ' + item.date + '</small>' +
          '</div>' +
        '</article>';
      }).join('') + '</div>';
  }

  function creditTone(status) {
    if (status === '已认定') return 'approved';
    if (status === '已退回') return 'returned';
    if (status === '待教师审核') return 'wait';
    if (status === '未申请') return 'idle';
    return 'pending';
  }

  function creditGroup(status) {
    if (status === '待初审' || status === '待社长重审') return 'pending';
    if (status === '待教师审核') return 'submitted';
    if (status === '已认定') return 'approved';
    return 'unsubmitted';
  }

  function creditRows(club) {
    return club.members.map(function (member) {
      var credit = club.credits.filter(function (item) { return item.name === member.name; })[0];
      return { member: member, credit: credit };
    });
  }

  function creditRowsHtml(club) {
    var rowsAll = creditRows(club);
    var keyword = state.creditKeyword.trim();
    var rows = rowsAll.filter(function (row) {
      if (keyword && (row.member.name + row.member.cls).indexOf(keyword) === -1) return false;
      if (state.creditFilter === 'all') return true;
      if (!row.credit) return state.creditFilter === 'unsubmitted';
      return creditGroup(row.credit.status) === state.creditFilter;
    });

    var listHtml = rows.map(function (row) {
      var member = row.member;
      var credit = row.credit;
      var status = credit ? credit.status : '未申请';
      var actionable = status === '待初审' || status === '待社长重审';
      var detail;
      if (!credit || status === '未申请') {
        detail = member.cls + ' · 本学期尚未提交学分申请';
      } else if (credit.self) {
        detail = '社长 · 组织 ' + club.activities.length + ' 场 · 系统记录 ' + credit.system + ' 小时 · 申报 ' + credit.declared + ' 学时';
      } else {
        detail = member.cls + ' · 申报 ' + credit.declared + ' 学时 · 系统记录 ' + credit.system + ' 小时';
      }
      var action = '';
      if (credit) {
        var realIndex = club.credits.indexOf(credit);
        if (credit.self) {
          if (status === '待教师审核') {
            action = '<button type="button" class="mini-btn danger" data-act="credit:selfWithdraw" data-index="' + realIndex + '">撤回</button>' +
              '<button type="button" class="mini-btn ghost" data-act="credit:detail" data-index="' + realIndex + '">查看</button>';
          } else if (status === '已认定') {
            action = '<button type="button" class="mini-btn ghost" data-act="credit:detail" data-index="' + realIndex + '">查看</button>';
          } else {
            action = '<button type="button" class="mini-btn primary" data-act="credit:selfApply" data-index="' + realIndex + '">立即申请</button>';
          }
        } else {
          action = '<button type="button" class="mini-btn ghost" data-act="' + (actionable ? 'credit:review' : 'credit:detail') +
            '" data-index="' + realIndex + '">' + (actionable ? '审核' : '查看') + '</button>';
        }
      }
      return '<div class="credit-row">' +
        '<span class="member-avatar">' + member.name.charAt(0) + '</span>' +
        '<div class="credit-main">' +
          '<h4>' + member.name + '<span class="role-pill ' + (member.role === '社长' ? 'leader' : '') + '">' + member.role + '</span></h4>' +
          '<p>' + detail + '</p>' +
        '</div>' +
        '<span class="credit-status ' + creditTone(status) + '">' + status + '</span>' +
        action +
      '</div>';
    }).join('');
    return (listHtml || '<div class="empty-mini"><strong>该条件下暂无成员</strong></div>') +
      '<p class="credit-foot">共 ' + rowsAll.length + ' 位社团成员（含社长）· 当前显示 ' + rows.length + ' 位</p>';
  }

  function creditsTab(club) {
    var rowsAll = creditRows(club);
    var pendingInitial = rowsAll.filter(function (row) { return row.credit && row.credit.status === '待初审'; }).length;
    var pendingRereview = rowsAll.filter(function (row) { return row.credit && row.credit.status === '待社长重审'; }).length;
    var pendingCount = pendingInitial + pendingRereview;
    var pendingDetail = [
      pendingInitial ? pendingInitial + '人待初审' : '',
      pendingRereview ? pendingRereview + '人待重审' : ''
    ].filter(Boolean).join(' · ');
    var alertHtml = pendingCount > 0
      ? '<div class="applicant-banner">' +
          '<div><span class="banner-badge">待处理学分申请</span>' +
            '<p>有 <strong>' + pendingCount + '</strong> 份学分申请待你审核（' + pendingDetail + '）</p>' +
          '</div>' +
          '<button type="button" data-act="credit:goProcess">去处理（' + pendingCount + '）›</button>' +
        '</div>'
      : '';
    var filters = [
      { key: 'all', label: '全部成员', count: rowsAll.length },
      { key: 'pending', label: '待我处理', count: pendingCount },
      { key: 'submitted', label: '待教师审核', count: rowsAll.filter(function (row) { return row.credit && creditGroup(row.credit.status) === 'submitted'; }).length },
      { key: 'approved', label: '已通过', count: rowsAll.filter(function (row) { return row.credit && creditGroup(row.credit.status) === 'approved'; }).length },
      { key: 'unsubmitted', label: '未申请', count: rowsAll.filter(function (row) { return !row.credit || creditGroup(row.credit.status) === 'unsubmitted'; }).length }
    ];

    return alertHtml +
      '<label class="mp-search member-search">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.4 4.4"/></svg>' +
        '<input type="text" id="creditSearch" placeholder="搜索成员姓名、班级" value="' + state.creditKeyword + '" autocomplete="off" />' +
      '</label>' +
      '<div class="filter-pills">' + filters.map(function (item) {
        return '<button type="button" class="' + (state.creditFilter === item.key ? 'active' : '') + '" data-act="credit:filter" data-filter="' + item.key + '">' + item.label + '（' + item.count + '）</button>';
      }).join('') +
    '</div><div class="credit-list" id="creditList">' + creditRowsHtml(club) + '</div>';
  }

  function managedHtml() {
    var club = currentManage();
    var pendingCredits = club.credits.filter(function (item) {
      return item.status === '待初审' || item.status === '待社长重审';
    }).length;
    var tabs = [
      { key: 'members', label: '成员名册（' + club.members.length + '）' },
      { key: 'activities', label: '社团活动（' + club.activities.length + '）' },
      { key: 'showcase', label: '成果荣誉（' + (club.showcase.works.length + club.showcase.honors.length) + '）' },
      { key: 'credits', label: '社团学分' + (pendingCredits > 0 ? '（' + pendingCredits + '）' : '') }
    ];
    var tabContent = '';
    if (state.manageTab === 'members') tabContent = membersTab(club);
    if (state.manageTab === 'activities') tabContent = activitiesTab(club);
    if (state.manageTab === 'showcase') tabContent = showcaseTab(club);
    if (state.manageTab === 'credits') tabContent = creditsTab(club);

    return '<div class="seg-control">' +
        '<button type="button" data-act="tab:joined">我报名的</button>' +
        '<button type="button" class="active" data-act="tab:managed">我管理的</button>' +
      '</div>' +
      '<div class="manage-bar">' +
        '<button type="button" class="mine-term" data-act="pick" data-kind="manageClub">' + club.name +
          '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
        '</button>' +
        '<button type="button" class="mine-term compact" data-act="pick" data-kind="manageTerm">' + (isArchived() ? '已归档学期' : '当前学期') +
          '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="manage-meta">' +
        '<span>社长 <b>' + club.captain + '</b></span>' +
        '<span>常规场地 <b>' + club.venue + '</b></span>' +
        '<span>累计活动 <b>' + club.activities.length + ' 场</b></span>' +
      '</div>' +
      (isArchived() ? '<div class="archive-note">该学期已归档，内容仅可查看。</div>' : '') +
      (club.endPending ? '<div class="archive-note">你已提交提前结束本社团本学期运行的申请，正在等待负责教师审批。在教师确认前，当前社团活动与名册正常保持。</div>' : '') +
      '<div class="manage-actions column">' +
        '<button type="button" class="manage-action primary" data-act="activity:publish"' + (isArchived() ? ' disabled' : '') + '>' +
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>发布新活动' +
        '</button>' +
        '<div class="manage-actions-sub">' +
          '<button type="button" class="manage-action" data-act="renewal:open"' + (isArchived() ? ' disabled' : '') + '>申请延续到下学期</button>' +
          '<button type="button" class="manage-action" data-act="end:open"' + (isArchived() || club.endPending ? ' disabled' : '') + '>申请提前结束</button>' +
        '</div>' +
      '</div>' +
      '<div class="manage-tabs">' + tabs.map(function (tab) {
        return '<button type="button" class="' + (state.manageTab === tab.key ? 'active' : '') + '" data-act="manage:tab" data-tab="' + tab.key + '">' + tab.label + '</button>';
      }).join('') + '</div>' +
      '<div class="manage-tab-content">' + tabContent + '</div>';
  }

  function render() {
    contentEl.innerHTML = state.tab === 'joined' ? mineHtml() : managedHtml();
  }

  /* ---------- 学分弹层 ---------- */
  function openCreditApply(club) {

  /* ---------- 活动瞬间弹层 ---------- */
  function getPosts(activityId) {
    if (!MOMENTS[activityId]) {
      MOMENTS[activityId] = [
        { author: '赵子易', role: '成员', time: '10-23 18:20', text: '活动顺利结束，记录一下今天的现场。', photo: MOMENT_PHOTOS[0], likes: 5, liked: false, comments: [] }
      ];
    }
    return MOMENTS[activityId];
  }

  var momentCtx = null;

  function renderMomentSheet() {
    if (!momentCtx) return;
    var club = findJoined(momentCtx.clubId);
    var activity = club.activities[momentCtx.index];
    var posts = getPosts(activity.id);
    var body =
      '<div class="moment-head">' +
        '<span class="tag tag-cat">' + club.name + '</span>' +
        '<h3>' + activity.title + '</h3>' +
        '<p>' + activity.day + ' ' + activity.week + ' · ' + activity.time + ' · ' + activity.venue + '</p>' +
        '<span class="moment-count">已有 ' + posts.length + ' 份分享</span>' +
      '</div>' +
      '<div class="moment-composer">' +
        '<textarea id="momentText" placeholder="说一句当时的心情（选填）"></textarea>' +
        '<div class="moment-composer-row">' +
          '<input type="file" accept="image/*" id="momentFile" hidden />' +
          '<button type="button" class="moment-add" data-act="moment:pick">＋ 添加照片</button>' +
          '<span id="momentPickTip">' + (composerPhoto ? '已选择 1 张照片' : '最多 3 张照片') + '</span>' +
          '<button type="button" class="mini-btn primary" data-act="moment:publish">发布</button>' +
        '</div>' +
      '</div>' +
      '<div class="moment-list">' + posts.map(function (post, index) {
        return '<article class="moment-post">' +
          '<div class="moment-post-head"><span class="member-avatar small">' + post.author.charAt(0) + '</span>' +
            '<div><strong>' + post.author + '<em>' + post.role + '</em></strong><span>' + post.time + '</span></div>' +
          '</div>' +
          (post.text ? '<p>' + post.text + '</p>' : '') +
          (post.photo ? '<span class="moment-photo" style="background-image:url(\'' + post.photo + '\')"></span>' : '') +
          '<div class="moment-post-foot">' +
            '<button type="button" class="' + (post.liked ? 'liked' : '') + '" data-act="moment:like" data-index="' + index + '">' +
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="' + (post.liked ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2 4.6 13a4.4 4.4 0 0 1 6.2-6.2l1.2 1.2 1.2-1.2A4.4 4.4 0 0 1 19.4 13L12 20.2Z"/></svg>' +
              post.likes +
            '</button>' +
            '<span>评论 ' + post.comments.length + '</span>' +
          '</div>' +
          (post.comments.length ? '<div class="moment-comments">' + post.comments.map(function (comment) {
            return '<p><b>' + comment.author + '：</b>' + comment.text + '</p>';
          }).join('') + '</div>' : '') +
        '</article>';
      }).join('') + '</div>';
    openSheet('活动瞬间', body, '', true);
  }

    var club = currentManage();

    var body =
      '<p class="sheet-lead">' + activity.title + ' · ' + activity.day + ' ' + activity.week + ' ' + activity.time + '</p>' +
      '<div class="attend-list">' + club.members.map(function (member) {
        var value = attendanceCtx.values[member.name];
        return '<div class="attend-row">' +
          '<span class="member-avatar">' + member.name.charAt(0) + '</span>' +
          '<div class="attend-main">' +
            '<h4>' + member.name + '<span class="role-pill ' + (member.role === '社长' ? 'leader' : '') + '">' + member.role + '</span></h4>' +
            '<p>' + member.cls + '</p>' +
          '</div>' +
          '<div class="attend-options">' + ['正常出勤', '缺勤', '请假'].map(function (option) {

        '<input type="number" id="selfHours" min="0" step="0.5" value="' + (credit.declared || '') + '" placeholder="如：15" />' +
      '</div>' +
      '<div class="field"><label class="field-label">收获与体会</label>' +
        '<textarea id="selfSummary" placeholder="如：本学期负责社团整体运营与每周训练组织">' + (credit.reason || '') + '</textarea>' +
      '</div>';
    openSheet('申请社团学分', body,
      '<button type="button" class="btn btn-primary" data-act="credit:selfSubmit" data-index="' + index + '">提交申请</button>', true);
  }

  var showcaseDraft = null;

  function openShowcaseAdd() {
    var club = currentManage();
    var isWork = state.showcaseTab === 'works';
    showcaseDraft = { media: PHOTOS.football, creators: [] };
    var creatorNames = club.members.map(function (member) { return member.name; }).concat(['全体成员']);
    var body =
      '<div class="field"><label class="field-label">' + (isWork ? '作品名称' : '荣誉名称') + '</label>' +
        '<input type="text" id="scTitle" placeholder="' + (isWork ? '如：校园足球战术手册' : '如：校园足球联赛冠军') + '" />' +
      '</div>' +
      '<div class="field"><label class="field-label">' + (isWork ? '作品媒体' : '荣誉证明') + '</label>' +
        '<div class="sc-media">' + [PHOTOS.football, PHOTOS.doc, PHOTOS.read].map(function (src) {
          return '<button type="button" class="' + (src === showcaseDraft.media ? 'selected' : '') + '" data-act="showcase:media" data-src="' + src + '">' +
            '<img src="' + src + '" alt="选择媒体" />' +
          '</button>';
        }).join('') + '</div>' +
      '</div>' +
      (isWork
        ? '<div class="field"><label class="field-label">实际创作成员</label><div class="sc-creators">' + creatorNames.map(function (name) {
            return '<button type="button" data-act="showcase:creator" data-name="' + name + '">' + name + '</button>';
          }).join('') + '</div></div>'
        : '<div class="field"><label class="field-label">获得时间</label><input type="text" id="scTime" placeholder="如：2026-10" /></div>') +
      '<div class="field"><label class="field-label">说明</label><textarea id="scDesc" placeholder="补充作品或荣誉的相关说明"></textarea></div>';
    openSheet(isWork ? '上传作品' : '登记荣誉', body,
      '<button type="button" class="btn btn-primary" data-act="showcase:submit">保存并公开展示</button>', true);
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', function (event) {
    var el = event.target.closest('[data-act]');
    if (!el) {
      if (event.target === sheetMask) closeSheet();
      if (event.target === confirmMask) closeConfirm();
      return;
    }
    var act = el.getAttribute('data-act');

    if (act === 'sheet:close') return closeSheet();
    if (act === 'confirm:no') return closeConfirm();
    if (act === 'confirm:yes') {
      var callback = confirmCallback;
      closeConfirm();
      if (callback) callback();
      return;
    }

    if (act === 'tab:joined') { state.tab = 'joined'; render(); return; }
    if (act === 'tab:managed') { state.tab = 'managed'; render(); return; }

    if (act === 'pick') return openPicker(el.getAttribute('data-kind'));
    if (act === 'pick:choose') {
      var kind = el.getAttribute('data-kind');
      var value = el.getAttribute('data-value');
      if (PICKERS[kind]) PICKERS[kind].apply(value);
      closeSheet();
      render();
      return;
    }

    if (act === 'pending:toggle') {
      state.pendingOpen = !state.pendingOpen;
      render();
      return;
    }
    if (act === 'pending:cancel') {
      openConfirm('取消「' + MINE.pending.name + '」的报名？', '取消后本学期将无法参加该社团活动，再次加入需重新提交申请。', function () {
        state.pendingWithdrawn = true;
        state.pendingOpen = false;
        render();
        toast('已取消报名申请');
      });
      return;
    }

    if (act === 'club:expand') {
      var expandId = el.getAttribute('data-id');
      state.expanded = state.expanded === expandId ? '' : expandId;
      render();
      return;
    }
    if (act === 'club:view') {
      location.href = 'club-detail.html?id=' + el.getAttribute('data-id') + '&joined=1';
      return;
    }
    if (act === 'club:showcase') {
      location.href = 'club-detail.html?id=' + el.getAttribute('data-id') + '&joined=1&tab=showcase';
      return;
    }

    if (act === 'credit:apply') {
      var applyClub = findJoined(el.getAttribute('data-id'));
      if (applyClub) openCreditApply(applyClub);
      return;
    }
    if (act === 'credit:view') {
      var viewClub = findJoined(el.getAttribute('data-id'));
      if (viewClub) openCreditResult(viewClub);
      return;
    }
    if (act === 'credit:viewApply') {
      var pendingClub = findJoined(el.getAttribute('data-id'));
      if (pendingClub) openCreditPending(pendingClub);
      return;
    }
    if (act === 'credit:withdraw') {
      var withdrawClub = findJoined(el.getAttribute('data-id'));
      if (!withdrawClub) return;
      openConfirm('撤回学分申请？', '撤回后本次申请作废且无法恢复，认定学分需重新提交申请。', function () {
        withdrawClub.credit = 'none';
        closeSheet();
        render();
        toast('已撤回「' + withdrawClub.name + '」的学分申请');
      });
      return;
    }
    if (act === 'credit:submit') {
      var submitClub = findJoined(el.getAttribute('data-id'));
      if (!submitClub) return;
      var hoursInput = document.getElementById('creditHours');
      var summaryInput = document.getElementById('creditSummary');
      var hours = hoursInput ? hoursInput.value.trim() : '';
      if (!hours) { toast('请填写申报学时'); return; }
      submitClub.credit = 'pending';
      submitClub.pendingHours = hours;
      submitClub.creditSummary = summaryInput ? summaryInput.value.trim() : '';
      closeSheet();
      render();
      toast('学分申请已提交，等待社长初审');
      return;
    }

    if (act === 'moment:open') {
      momentCtx = { clubId: el.getAttribute('data-id'), index: Number(el.getAttribute('data-index')) };
      composerPhoto = null;
      renderMomentSheet();
      return;
    }
    if (act === 'moment:like') {
      if (!momentCtx) return;
      var likeClub = findJoined(momentCtx.clubId);
      var likeActivity = likeClub.activities[momentCtx.index];
      var posts = getPosts(likeActivity.id);
      var post = posts[Number(el.getAttribute('data-index'))];
      if (post) {
        post.liked = !post.liked;
        post.likes += post.liked ? 1 : -1;
      }
      renderMomentSheet();
      return;
    }
    if (act === 'moment:pick') {
      var fileInput = document.getElementById('momentFile');
      if (fileInput) fileInput.click();
      return;
    }
    if (act === 'moment:publish') {
      if (!momentCtx) return;
      var publishClub = findJoined(momentCtx.clubId);
      var publishActivity = publishClub.activities[momentCtx.index];
      var textInput = document.getElementById('momentText');
      var text = textInput ? textInput.value.trim() : '';
      if (!text && !composerPhoto) { toast('请填写心情或添加照片'); return; }
      var posts = getPosts(publishActivity.id);
      posts.unshift({
        author: '赵子易', role: '成员', time: '刚刚', text: text,
        photo: composerPhoto || '', likes: 0, liked: false, comments: []
      });
      publishActivity.shares += 1;
      composerPhoto = null;
      render();
      renderMomentSheet();
      toast('精彩瞬间已发布，仅本社团成员可见');
      return;
    }

    if (act === 'manage:tab') {
      state.manageTab = el.getAttribute('data-tab');
      render();
      return;
    }
    if (act === 'member:clear') {
      state.memberKeyword = '';
      render();
      return;
    }
    if (act === 'members:export') {
      toast('已导出「' + currentManage().name + '」成员名单 Excel 表格');
      return;
    }
    if (act === 'history:open') return openHistory();

    if (act === 'applicant:review') return openApplicantReview(Number(el.getAttribute('data-index')));
    if (act === 'applicant:approve') {
      var approveClub = currentManage();
      var approveIndex = Number(el.getAttribute('data-index'));
      var approved = approveClub.applicants[approveIndex];
      if (!approved) return;
      approveClub.applicants.splice(approveIndex, 1);
      approveClub.members.push({ name: approved.name, role: '成员', cls: approved.cls, join: '2026-09-18', count: 0, phone: approved.phone });
      closeSheet();
      render();
      toast('已通过「' + approved.name + '」的入团申请');
      return;
    }
    if (act === 'applicant:reject') {
      var rejectClub = currentManage();
      var rejectIndex = Number(el.getAttribute('data-index'));
      var rejected = rejectClub.applicants[rejectIndex];
      if (!rejected) return;
      rejectClub.applicants.splice(rejectIndex, 1);
      closeSheet();
      render();
      toast('已退回「' + rejected.name + '」的入团申请');
      return;
    }

    if (act === 'activity:filter') {
      state.activityFilter = el.getAttribute('data-filter');
      render();
      return;
    }
    if (act === 'activity:attendance') {
      var attendanceRaw = el.getAttribute('data-index');
      var attendanceIndex = attendanceRaw === null ? moreIndex : Number(attendanceRaw);
      return openAttendance(attendanceIndex);
    }
    if (act === 'attendance:mark') {
      if (!attendanceCtx) return;
      var markName = el.getAttribute('data-name');
      attendanceCtx.values[markName] = el.getAttribute('data-value');
      var markRow = el.closest('.attend-row');
      if (markRow) {
        Array.prototype.forEach.call(markRow.querySelectorAll('.attend-options button'), function (button) {
          button.classList.toggle('active', button === el);
        });
      }
      return;
    }
    if (act === 'attendance:submit') {
      if (!attendanceCtx) return;
      var attendanceClub = currentManage();
      var attendanceActivity = attendanceClub.activities[attendanceCtx.index];
      if (!attendanceActivity) return;
      var totalMembers = attendanceClub.members.length;
      var presentCount = 0;
      var absentCount = 0;
      var leaveCount = 0;
      Object.keys(attendanceCtx.values).forEach(function (key) {
        var marked = attendanceCtx.values[key];
        if (marked === '正常出勤') presentCount += 1;
        else if (marked === '缺勤') absentCount += 1;
        else leaveCount += 1;
      });
      attendanceActivity.attendance = presentCount === totalMembers
        ? '实到 ' + totalMembers + ' 人（全勤）'
        : '正常出勤 ' + presentCount + ' 人' +
          (absentCount ? ' · 缺勤 ' + absentCount + ' 人' : '') +
          (leaveCount ? ' · 请假 ' + leaveCount + ' 人' : '');
      attendanceActivity.attendanceDone = true;
      attendanceCtx = null;
      closeSheet();
      render();
      toast('考勤已保存');
      return;
    }
    if (act === 'activity:record') {
      var recordRaw = el.getAttribute('data-index');
      var recordTarget = recordRaw === null ? moreIndex : Number(recordRaw);
      return openRecord(recordTarget);
    }
    if (act === 'record:submit') {
      var recordClub = currentManage();
      var recordActivity = recordClub.activities[recordIndex];
      if (!recordActivity) return;
      var recordTextEl = document.getElementById('recordText');
      var recordFileEl = document.getElementById('recordFile');
      var recordTextValue = recordTextEl ? recordTextEl.value.trim() : '';
      if (!recordTextValue) { toast('请填写活动记录'); return; }
      recordActivity.recordText = recordTextValue;
      recordActivity.record = '已填活动记录';
      recordActivity.recordDone = true;
      recordActivity.attachment = recordFileEl ? recordFileEl.value.trim() : recordActivity.attachment;
      closeSheet();
      render();
      toast('活动记录已保存');
      return;
    }
    if (act === 'activity:more') return openActivityMore(Number(el.getAttribute('data-index')));
    if (act === 'activity:edit') return openEditActivity(moreIndex);
    if (act === 'activity:delete') {
      var deleteClub = currentManage();
      var deleteActivity = deleteClub.activities[moreIndex];
      if (!deleteActivity) return;
      openConfirm('删除这场活动？', '删除后，这场活动将从社团活动安排中完全移除。', function () {
        deleteClub.activities.splice(moreIndex, 1);
        closeSheet();
        render();
        toast('已删除「' + deleteActivity.title + '」');
      });
      return;
    }
    if (act === 'activity:saveEdit') {
      var editClub = currentManage();
      var editActivity = editClub.activities[editIndex];
      if (!editActivity) return;
      var editTitleEl = document.getElementById('actTitle');
      var editTitleValue = editTitleEl ? editTitleEl.value.trim() : '';
      if (!editTitleValue) { toast('请填写活动名称'); return; }
      var editDate = (document.getElementById('actDate') || {}).value || '';
      var editStart = (document.getElementById('actStart') || {}).value || '';
      var editEnd = (document.getElementById('actEnd') || {}).value || '';
      editActivity.title = editTitleValue;
      editActivity.venue = ((document.getElementById('actVenue') || {}).value || editActivity.venue).trim();
      editActivity.time = (editStart || '待定') + (editEnd ? ' - ' + editEnd : '');
      editActivity.desc = ((document.getElementById('actDesc') || {}).value || editActivity.desc).trim();
      editActivity.attachment = ((document.getElementById('actFile') || {}).value || '').trim();
      if (editDate) {
        editActivity.fullDate = editDate.trim();
        var editDateParts = editActivity.fullDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (editDateParts) editActivity.day = Number(editDateParts[2]) + '.' + editDateParts[3];
      }
      closeSheet();
      render();
      toast('活动信息已更新');
      return;
    }
    if (act === 'activity:detail') return openActivityDetail(Number(el.getAttribute('data-index')));
    if (act === 'activity:moments') {
      var activityClub = currentManage();
      var activityIndex = Number(el.getAttribute('data-index'));
      var activity = activityClub.activities[activityIndex];
      if (!activity) return;
      momentCtx = null;
      var posts = getPosts(activity.id);
      var body =
        '<div class="moment-head"><span class="tag tag-cat">' + activityClub.name + '</span>' +
          '<h3>' + activity.title + '</h3><p>' + activity.day + ' ' + activity.week + ' · ' + activity.time + ' · ' + activity.venue + '</p>' +
          '<span class="moment-count">已有 ' + posts.length + ' 份分享</span></div>' +
        '<div class="moment-list">' + posts.map(function (post) {
          return '<article class="moment-post"><div class="moment-post-head">' +
            '<span class="member-avatar small">' + post.author.charAt(0) + '</span>' +
            '<div><strong>' + post.author + '<em>' + post.role + '</em></strong><span>' + post.time + '</span></div></div>' +
            (post.text ? '<p>' + post.text + '</p>' : '') +
            (post.photo ? '<span class="moment-photo" style="background-image:url(\'' + post.photo + '\')"></span>' : '') +
            '<div class="moment-post-foot"><span>点赞 ' + post.likes + '</span><span>评论 ' + post.comments.length + '</span></div>' +
          '</article>';
        }).join('') + '</div>';
      openSheet('活动瞬间', body, '', true);
      return;
    }
    if (act === 'activity:publish') return openPublishActivity();
    if (act === 'activity:allMoments') return openAllMoments();
    if (act === 'activity:submit') {
      var publishTitle = document.getElementById('actTitle');
      var title = publishTitle ? publishTitle.value.trim() : '';
      if (!title) { toast('请填写活动名称'); return; }
      var dateValue = (document.getElementById('actDate') || {}).value || '';
      var venueValue = (document.getElementById('actVenue') || {}).value || '';
      var startValue = (document.getElementById('actStart') || {}).value || '';
      var endValue = (document.getElementById('actEnd') || {}).value || '';
      var descValue = (document.getElementById('actDesc') || {}).value || '';
      var fileValue = (document.getElementById('actFile') || {}).value || '';
      var dateParts = dateValue.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      currentManage().activities.unshift({
        id: 'act-' + Date.now(),
        day: dateParts ? Number(dateParts[2]) + '.' + dateParts[3] : '待定',
        week: '待定',
        title: title,
        state: '待开展',
        time: (startValue || '待定') + (endValue ? ' - ' + endValue : ''),
        venue: venueValue || '待定',
        attendance: '待点名（应到 ' + currentManage().members.length + ' 人）',
        record: '未填活动记录',
        attachment: fileValue,
        shares: 0,
        desc: descValue || '活动说明待补充。'
      });
      state.manageTab = 'activities';
      closeSheet();
      render();
      toast('活动已发布，等待成员查看');
      return;
    }

    if (act === 'renewal:open') return openRenewal();
    if (act === 'end:open') return openEndApply();
    if (act === 'end:submit') {
      var endReasonEl = document.getElementById('endReason');
      if (!endReasonEl || !endReasonEl.value.trim()) { toast('请填写申请说明'); return; }
      currentManage().endPending = true;
      closeSheet();
      render();
      toast('提前结束申请已提交，等待教师审批');
      return;
    }
    if (act === 'renewal:submit') {
      var reasonInput = document.getElementById('renewalReason');
      if (!reasonInput || !reasonInput.value.trim()) { toast('请填写申请说明'); return; }
      closeSheet();
      toast('延续到下学期申请已提交，等待教师确认');
      return;
    }

    if (act === 'showcase:add') return openShowcaseAdd();
    if (act === 'showcase:media') {
      if (!showcaseDraft) return;
      showcaseDraft.media = el.getAttribute('data-src');
      Array.prototype.forEach.call(document.querySelectorAll('.sc-media button'), function (button) {
        button.classList.toggle('selected', button === el);
      });
      return;
    }
    if (act === 'showcase:creator') {
      if (!showcaseDraft) return;
      var creatorName = el.getAttribute('data-name');
      if (creatorName === '全体成员') {
        showcaseDraft.creators = showcaseDraft.creators.indexOf('全体成员') === -1 ? ['全体成员'] : [];
      } else if (showcaseDraft.creators.indexOf(creatorName) === -1) {
        showcaseDraft.creators = showcaseDraft.creators.filter(function (name) { return name !== '全体成员'; }).concat([creatorName]);
      } else {
        showcaseDraft.creators = showcaseDraft.creators.filter(function (name) { return name !== creatorName; });
      }
      Array.prototype.forEach.call(document.querySelectorAll('.sc-creators button'), function (button) {
        button.classList.toggle('selected', showcaseDraft.creators.indexOf(button.getAttribute('data-name')) !== -1);
      });
      return;
    }
    if (act === 'showcase:submit') {
      if (!showcaseDraft) return;
      var showcaseClub = currentManage();
      var isWorkItem = state.showcaseTab === 'works';
      var scTitleValue = ((document.getElementById('scTitle') || {}).value || '').trim();
      var scDescValue = ((document.getElementById('scDesc') || {}).value || '').trim();
      var nowDate = new Date();
      var dateText = nowDate.getFullYear() + '-' +
        String(nowDate.getMonth() + 1).padStart(2, '0') + '-' +
        String(nowDate.getDate()).padStart(2, '0');
      if (isWorkItem) {
        showcaseClub.showcase.works.unshift({
          title: scTitleValue || '未命名作品',
          creator: showcaseDraft.creators.join('、') || '全体成员',
          date: dateText,
          desc: scDescValue || '暂无说明',
          image: showcaseDraft.media
        });
      } else {
        var scTimeValue = ((document.getElementById('scTime') || {}).value || '').trim() || dateText.slice(0, 7);
        showcaseClub.showcase.honors.unshift({
          title: scTitleValue || '未命名荣誉',
          time: scTimeValue,
          date: dateText,
          desc: scDescValue || '暂无说明',
          image: showcaseDraft.media
        });
      }
      showcaseDraft = null;
      closeSheet();
      render();
      toast(isWorkItem ? '作品已上传并公开展示' : '荣誉已登记并公开展示');
      return;
    }
    if (act === 'showcase:tab') {
      state.showcaseTab = el.getAttribute('data-tab');
      render();
      return;
    }
    if (act === 'credit:filter') {
      state.creditFilter = el.getAttribute('data-filter');
      render();
      return;
    }
    if (act === 'credit:goProcess') {
      var processClub = currentManage();
      var nextIndex = -1;
      processClub.credits.forEach(function (item, index) {
        if (nextIndex === -1 && (item.status === '待初审' || item.status === '待社长重审')) nextIndex = index;
      });
      if (nextIndex === -1) { toast('当前没有待处理的学分申请'); return; }
      return openCreditReview(nextIndex);
    }
    if (act === 'credit:selfApply') return openSelfApply(Number(el.getAttribute('data-index')));
    if (act === 'credit:selfWithdraw') {
      var selfClub = currentManage();
      var selfIndex = Number(el.getAttribute('data-index'));
      var selfCredit = selfClub.credits[selfIndex];
      if (!selfCredit) return;
      openConfirm('撤回学分申请？', '撤回后本次申请作废且无法恢复，认定学分需重新提交申请。', function () {
        selfCredit.status = '未申请';
        closeSheet();
        render();
        toast('已撤回学分申请');
      });
      return;
    }
    if (act === 'credit:selfSubmit') {
      var submitSelfClub = currentManage();
      var submitSelfIndex = Number(el.getAttribute('data-index'));
      var submitSelfCredit = submitSelfClub.credits[submitSelfIndex];
      if (!submitSelfCredit) return;
      var selfHoursEl = document.getElementById('selfHours');
      var selfSummaryEl = document.getElementById('selfSummary');
      var selfHoursValue = selfHoursEl ? selfHoursEl.value.trim() : '';
      if (!selfHoursValue) { toast('请填写申报学时'); return; }
      submitSelfCredit.declared = selfHoursValue;
      submitSelfCredit.reason = selfSummaryEl ? selfSummaryEl.value.trim() : submitSelfCredit.reason;
      submitSelfCredit.status = '待教师审核';
      closeSheet();
      render();
      toast('学分申请已提交，等待教师审核');
      return;
    }
    if (act === 'credit:review') return openCreditReview(Number(el.getAttribute('data-index')));
    if (act === 'credit:detail') return openCreditDetail(Number(el.getAttribute('data-index')));
    if (act === 'credit:approve' || act === 'credit:return') {
      var creditClub = currentManage();
      var creditIndex = Number(el.getAttribute('data-index'));
      var credit = creditClub.credits[creditIndex];
      if (!credit) return;
      var noteInput = document.getElementById('creditNote');
      var note = noteInput ? noteInput.value.trim() : '';
      if (act === 'credit:approve') {
        credit.status = '已认定';
        credit.note = note || '审核通过。';
      } else {
        credit.status = '已退回';
        credit.note = note || '请按系统记录时长调整申报学时后重新提交。';
      }
      closeSheet();
      render();
      toast(act === 'credit:approve' ? '已通过「' + credit.name + '」的学分申请' : '已退回「' + credit.name + '」的学分申请');
      return;
    }
  });

  document.addEventListener('change', function (event) {
    if (event.target.id === 'memberSearch') {
      state.memberKeyword = event.target.value;
      var list = document.getElementById('memberList');
      if (list) list.innerHTML = membersHtml(currentManage());
