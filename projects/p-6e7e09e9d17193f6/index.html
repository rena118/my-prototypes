<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>teacher-desktop-prototype · 原型评审</title>
        <style>
            :root {
                --bg: #f7f8f8;
                --surface: #fff;
                --alt: #f1f2f4;
                --border: #d8dee3;
                --note-divider: color-mix(in srgb, var(--border) 60%, var(--surface));
                --text: #1a1d23;
                --muted: #4e5560;
                --accent: #2563eb;
                --soft: #eef2ff;
                --control: #808790;
                --on-accent: #fff;
                --font: 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei', system-ui, sans-serif;
                --left: 224px;
                --right: 400px;
            }
            * { box-sizing: border-box; }
            @media (prefers-color-scheme: dark) { :root { --bg:#0b0d10;--surface:#121519;--alt:#1a1e23;--border:#363c44;--text:#f2f4f7;--muted:#a8b0ba;--accent:#7ba2ff;--soft:#1b2946;--control:#7e8795;--on-accent:#0b0d10;color-scheme:dark; } }
            /* 文字颜色：正文存浅色 token，暗底按 DESIGN_MASTER 暗色对应色映射（与工作台 proto-markdown.css 同一张表） */
            @media (prefers-color-scheme: dark) {
                [style="color:#b42318"] { color: #ff8a8a !important; } [style="color:#b45309"] { color: #f0a35e !important; } [style="color:#046c4e"] { color: #5fd39b !important; }
                [style="color:#1d4ed8"] { color: #7ba2ff !important; } [style="color:#0f766e"] { color: #4fd1c5 !important; } [style="color:#626b78"] { color: #a8b0ba !important; }
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font: 14px/1.7 var(--font);
                height: 100vh;
                overflow: hidden;
                letter-spacing: .02em;
                display: flex;
                flex-direction: column;
            }
            .brand { width:32px;height:32px;padding:6px;border-radius:6px;background:var(--accent);color:var(--on-accent);flex:none; }
            svg { width:18px;height:18px;vertical-align:middle; }
            .brand svg { width:20px;height:20px; }
            button {
                min-height: 32px;
                font: inherit;
                color: inherit;
                border: 1px solid var(--control);
                border-radius: 6px;
                background: var(--surface);
                padding: 5px 10px;
                cursor: pointer;
                white-space: nowrap;
            }
            button:hover { background: var(--alt); }
            button:focus-visible,
            a:focus-visible,
            .note:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
            header.topbar {
                height: 56px;
                flex: none;
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 0 20px;
                border-bottom: 1px solid var(--border);
                background: var(--surface);
            }
            .topbar strong { flex: 1; }
            .topbar #scope { max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
            .muted { color: var(--muted); font-size: 12px; }
            #source { color:var(--muted);text-decoration:none;font-size:12px;white-space:nowrap; }
            #source:hover { color: var(--accent); }
            .layout {
                display: grid;
                grid-template-columns: var(--left) minmax(0, 1fr) var(--right);
                flex: 1;
                min-height: 0;
            }
            .layout.left-closed { --left: 40px; }
            .layout.right-closed { --right: 0px; }
            .layout.prd-empty { grid-template-columns: var(--left) minmax(0, 1fr) 0; }
            .left-closed #tree { display: none; }
            .right-closed aside, .prd-empty aside { display: none; }
            nav {
                overflow: auto;
                border-right: 1px solid var(--border);
                background: var(--surface);
            }
            nav > button { border: 0; width: 100%; padding: 12px; }
            .canvas { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
            iframe { border: 0; width: 100%; flex: 1; background: var(--surface); }
            aside {
                position: relative;
                background: var(--surface);
                overflow: auto;
                border-left: 1px solid var(--border);
                padding: 12px 16px 16px;
            }
            /* PRD 区左缘保留透明拖动区域。 */
            #prd-resizer { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; margin-left: -5px; cursor: ew-resize; touch-action: none; z-index: 6; }
            .right-closed #prd-resizer, .prd-empty #prd-resizer { display: none; }
            aside h2 { font-size: 17px; margin: 0 0 4px; }
            details { border-bottom: 1px solid var(--border); padding: 7px 0; }
            details:last-of-type { border-bottom: 0; }
            summary { font-weight: 600; cursor: pointer; line-height: 1.5; }
            details[open] > summary { margin-bottom: 6px; }
            summary:focus-visible { outline:2px solid var(--accent);outline-offset:2px; }
            .markdown { overflow-wrap: anywhere; }
            .markdown h1 { font-size: 20px; }
            .markdown h2 { font-size: 17px; }
            .markdown h3 { font-size: 15px; }
            .markdown h4 { font-size: 14px; }
            .markdown :is(h1,h2,h3,h4) { margin: 12px 0 6px; line-height: 1.55; }
            .markdown p { margin: 0; } /* 与工作台同口径：Enter 换段与自然折行间距一致 */
            .markdown > :first-child { margin-top: 0; }
            .markdown > :last-child { margin-bottom: 0; }
            .markdown pre { white-space: pre-wrap; background: var(--alt); padding: 10px; border-radius: 6px; }
            .markdown code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; background: var(--alt); padding: 1px 5px; border-radius: 4px; }
            .markdown pre code { background: none; padding: 0; }
            .markdown table { border-collapse: collapse; width: 100%; }
            .markdown th, .markdown td { border: 1px solid var(--border); padding: 6px; text-align: left; }
            .markdown blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
            .markdown ul, .markdown ol { padding-left: 22px; }
            .markdown li.task { list-style: none; margin-left: -20px; }
            .markdown a { color: var(--accent); }
            .markdown hr { border: 0; border-top: 1px solid var(--border); }
            .note { display: block; border-bottom: 1px dashed var(--note-divider); padding: 14px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; }
            .note:hover { background: var(--alt); }
            /* 与操作台右栏同式：序号单独首行，正文另起一行（预览与导出一致） */
            .note-head { display: flex; align-items: center; margin-bottom: 8px; }
            .note-no { min-width: 20px; height: 20px; margin: 0; padding: 0 5px; border-radius: 50% 50% 50% 4px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 600; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums; }
            .note.stale .note-no { background: var(--muted); }
            .note-no { --pin-custom-ink: #191919; }
            .note:not(.stale) .note-no { background: var(--pin-fill,var(--accent)); color: var(--pin-ink,var(--on-accent)); }
            .markdown img { display: block; max-width: 100%; height: auto; margin: 8px 0; border-radius: 6px; }
            .note .markdown { font-size: 14px; }
            .note .markdown > :first-child { margin-top: 0; }
            .note .markdown > :last-child { margin-bottom: 0; }
            .note.stale { opacity: .55; cursor: default; }
            .note.flash { animation: note-flash 1.2s ease; }
            .note.selected .note-head { background: var(--soft); border-radius: 6px; box-shadow: 0 0 0 4px var(--soft); }
            .note.selected .note-no { outline: 2px solid var(--accent); outline-offset: 3px; }
            @keyframes note-flash { 0%, 45% { background: var(--soft); } 100% { background: transparent; } }
            .empty { margin: 40px; padding: 24px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
            [hidden] { display: none !important; }
            @media (max-width: 1100px) {
                :root { --left: 180px; --right: 320px; }
                .topbar .muted { display: none; }
            }
        </style>

iews.html", "states": [{"id": "default", "title": "默认页面", "kind": "default"}], "parentId": "applications", "clientId": "teacher-desktop", "role": "page", "previewType": "web"}, {"id": "end-request-reviews", "title": "结束申请审核", "file": "end-request-reviews.html", "states": [{"id": "default", "title": "默认页面", "kind": "default"}], "parentId": "applications", "clientId": "teacher-desktop", "role": "page", "previewType": "web"}, {"id": "continuation-request-reviews", "title": "延续申请审核", "file": "continuation-request-reviews.html", "states": [{"id": "default", "title": "默认页面", "kind": "default"}], "parentId": "applications", "clientId": "teacher-desktop", "role": "page", "previewType": "web"}, {"id": "continuation-request-review", "title": "延续申请审核工作台", "file": "continuation-request-review.html", "states": [{"id": "default", "title": "默认页面", "kind": "default"}], "parentId": "continuation-request-reviews", "clientId": "teacher-desktop", "role": "page", "previewType": "web"}, {"id": "credit-review", "title": "学分审核工作台", "file": "credit-review.html", "states": [{"id": "default", "title": "默认页面", "kind": "default"}], "parentId": "credits", "clientId": "teacher-desktop", "role": "page", "previewType": "web"}, {"id": "credits", "title": "社团学分审核", "file": "credits.html", "states": [{"id": "default", "title": "默认页面", "kind": "default"}], "clientId": "teacher-desktop", "role": "page", "previewType": "web"}, {"id": "analysis", "title": "分析报告", "file": "analysis.html", "states": [{"id": "default", "title": "默认页面", "kind": "default"}], "clientId": "teacher-desktop", "role": "page", "previewType": "web", "navigationOverrides": ["order", "parentId", "clientId"]}, {"id": "end-request-review", "title": "结束申请审核工作台", "file": "end-request-review.html", "states": [{"id": "default", "title": "默认页面", "kind": "default"}], "parentId": "end-request-reviews", "clientId": "teacher-desktop", "role": "page", "previewType": "web"}], "clients": [{"id": "teacher-desktop", "title": "教师桌面端", "previewType": "web"}], "defaultPage": "home", "documents": [{"id": "8aa930c5-8e64-4baa-91cf-6c791f6d3e20", "pageId": "basic-settings-edit", "stateId": "default", "markdown": "## 页面定位\n\n- 配置当前学期学生社团的通用规则，并在保存时统一校验合法性。\n- 时间、数量与活动规则的具体口径、校验及二次编辑影响，以对应页面标注为准。\n", "confirmed": false, "updatedAt": "2026-11-04T00:00:00.000000+00:00"}, {"id": "bd8740df-41a7-44c1-9201-164519eb7db7", "pageId": "home", "stateId": "club-info", "markdown": "## 需求目标\n\n- 让教师在不替代学生日常运营的前提下，查看社团当前运行事实、原始申报信息和学校日常安排。", "confirmed": false, "updatedAt": "2026-11-02T09:58:08.248769+00:00"}, {"id": "8d8c7025-cdb6-491e-8108-afb39c58e1c0", "pageId": "home", "stateId": "club-members", "markdown": "## 需求目标\n\n- 让教师查看当前有效成员关系和待社长审核情况，并只在例外处理中维护正式成员关系。", "confirmed": false, "updatedAt": "2026-11-02T09:58:08.248769+00:00"}, {"id": "196e84c4-518f-45b7-add9-c8278089f205", "pageId": "home", "stateId": "club-credits", "markdown": "## 需求目标\n\n- 在社团详情中查看成员本学期学分申请和认定事实，不在此页替代独立审核工作台。", "confirmed": false, "updatedAt": "2026-11-02T09:58:08.248769+00:00"}, {"id": "90c377ae-a4d2-4da3-93ed-e61e437fb9b5", "pageId": "home", "stateId": "club-history", "markdown": "## 需求目标\n\n- 以简洁时间线呈现影响社团身份或学期存续的关键事实，而不是无差别操作日志。", "confirmed": false, "updatedAt": "2026-11-02T09:58:08.248769+00:00"}, {"id": "f50019b0-119d-4bd7-a5bb-bffe82c5206c", "pageId": "club-info", "stateId": "default", "markdown": "## 页面定位\n\n- 查看当前学期正式社团的运行事实、学生原始申报资料快照与学校日常支持安排的主页面；是教师进行必要资源支持与合规监督的一级详情承接载体。\n- 坚持“学生自主运营、教师支持监管”原则；页面信息以客观事实呈现为主，不替代学生社长日常组织与管理。\n\n## 业务边界\n\n- 场地信息双轨保留：学生申报填写的“拟用场地”与“场地说明”作为原始意愿永久保留；教师仅调整“学校日常安排”，且不替代单场活动的实际场地。\n- 治理操作受状态控制：进行中社团可提前结束或扩大人数；已提前结束社团可恢复运行；学期已结束可延续至下学期。\n", "confirmed": false, "updatedAt": "2026-11-09T09:27:26.012Z"}, {"id": "eec948de-e921-4247-b12e-55cc0dcd64ec", "pageId": "club-members", "stateId": "default", "markdown": "## 页面定位\n\n- 查看与监督社团当前有效正式成员名册及入团报名待审进度；在学校必要治理与线下确认的例外场景下维护正式成员关系。\n- 落实学生自主入团审核为主、学校管理责任为辅原则；教师仅处理例外情况，不替代社长日常入团审核。\n\n## 业务边界\n\n- 名册只展示当前有效成员：被移出成员从名册中消失，不在名册中打“已移出”混淆视听；移出记录进入独立的“变更记录 / 已移出成员”中留痕。\n- 教师添加成员只承接线下已充分沟通确认的事实，来源严格标记为“教师添加”，不伪造社长线上审批过程。\n- 学生社长在社团存续期内受角色保护，不能在成员管理中被直接移出；若需更换社长，仅在学期延续申请时重新指定。", "confirmed": false, "updatedAt": "2026-11-06T01:37:53.000Z"}, {"id": "10b61da1-9a3e-4498-9a87-2b78f198a434", "pageId": "club-credits", "stateId": "default", "markdown": "## 页面定位\n\n- 查看当前社团在本学期全员（社长及所有成员）的学分申报进展、初审与教师终审结果；作为社团学期评价事实的客观总览。\n- 坚持“学分是过程事实的派生结果”原则；本页作为事实核对与进度监督窗口，具体审核操作依然在独立的“社团学分审核”工作台中完成。\n\n## 业务边界\n\n- 本页为只读事实总览，不内嵌审核操作按钮或快捷批量通过，避免将“日常详情查看”与“专业审核工作台”职责混淆。\n- 全员全覆盖呈现：包含学生社长（单级审批）与普通成员（双级审批），并保留已移出但在本科目产生学分事实的学生记录。", "confirmed": false, "updatedAt": "2026-11-06T01:37:53.000Z"}, {"id": "a895bf9e-ba3b-42bb-81e4-c2dc8ce51cf3", "pageId": "club-history", "stateId": "default", "markdown": "## 页面定位\n\n- 按倒序时间线完整呈现社团在学校治理制度下的关键生命周期与组织身份演变事实。\n- 仅沉淀“社团成立、学期延续、停办治理、恢复运行与学期结题”的核心里程碑事实。\n\n## 业务边界\n\n- 严格穷收敛为 5 类生命周期关键事件：社团首次成立、延续至本学期、提前结束本学期社团、恢复本学期社团运行、学期结束/归档。\n- 细颗粒度事务不进入本时间线：社团日常活动开展、成员进出、瞬间分享、作品发布以及单人学分认定各自在对应业务对象中留痕，不污染社团主生命周期。\n- 社长变更规则：当前版本社长不支持学期中任意更换，仅在“延续到下学期”时支持换届换人；因此换社长事实自然融入“延续至本学期”事件中，不单设独立的社长变更事件。\n", "confirmed": false, "updatedAt": "2026-11-09T09:15:06.889Z"}, {"id": "25b46954-61f4-44e4-ba00-f83ba59260cc", "pageId": "home", "stateId": "default", "markdown": "## 页面定位\n\n- 展示所选学期已成立的正式社团及其运行事实；申报记录、待审核申请不进入此列表。\n- 教师从此进入社团详情、专项审核、分析和配置，不代替学生社长日常运营。\n\n## 边界\n\n- 无对应专项权限时不显示审核、配置等入口。\n", "confirmed": false, "updatedAt": "2026-11-04T08:54:28.904Z"}, {"id": "f5560ffb-a5ed-435e-9044-aa24bbfa486e", "pageId": "basic-settings", "stateId": "default", "markdown": "## 页面职责\n\n- 查看当前学期已经生效的社团通用设置；不在本页解释或修改具体规则。\n- 通过“编辑”进入独立编辑页，保存后的结果回到本页作为当前生效值展示。\n\n## 查看范围\n\n- 时间设置、数量设置、活动与开展规则仅展示当前配置摘要。\n- 历史业务记录不因后续调整而改写；具体规则、校验与生效边界见编辑页需求标注。\n", "confirmed": false, "updatedAt": "2026-11-03T08:43:41.506215+00:00"}, {"id": "fc128561-d2fb-4267-b537-16e834156d5e", "pageId": "activity-notice", "stateId": "default", "markdown": "## 页面职责\n\n- 维护学生在“社团申报”入口可主动查看的申报说明、材料指引和咨询信息；它是说明内容，不替代正式申报表或审核规则。\n", "confirmed": false, "updatedAt": "2026-11-09T06:26:42.739Z"}, {"id": "c56ba9f2-acbd-45cf-9b1c-838cfdcf1e09", "pageId": "form-settings", "stateId": "default", "markdown": "## 页面定位\n\n- 集中管理社团申报表、学分申请表、活动开展材料三类表单的填写内容；各表单字段在对应设置页维护，不在此页展开。\n", "confirmed": false, "updatedAt": "2026-11-09T16:30:00.000Z"}, {"id": "60d80b62-7464-446f-acf1-5b761237b049", "pageId": "category-settings", "stateId": "default", "markdown": "## 页面定位\n\n- 管理全校维度的学生社团分类标准；作为学生自主申报社团、首页列表多维筛选、宏观统计分析以及申报审核分流路由的数据基础。\n- 类别为学校治理提供基础业务分类支撑，不限制学生社团的自主性与多样性。\n\n## 业务边界\n\n- 社团类别为学校全局统一配置，跨学期长期沿用，不按单学期清空或强制重新配置。\n- 类别调整不改变既有历史社团的归属事实；删除仅约束后续新发起的社团申报。\n- 支持为类别指派申报审核老师，建立专业审核分流机制；未指派时按学校通用集中审核规则流转。\n", "confirmed": false, "updatedAt": "2026-11-09T06:45:51.300Z"}, {"id": "2c85bb39-530c-48b1-ae80-5f6f1ffbf3a2", "pageId": "credit-rules", "stateId": "default", "markdown": "## 页面定位\n\n- 设置学生社团学分认定的折算基准与换算公式；作为教师在学分终审工作台中依据“核定学时”自动生成“建议学分”的换算依据。\n- 学分规则仅作为系统辅助折算依据，不替代教师根据学生实际表现做出的最终核定；教师可在审核时微调最终学分并留痕。\n\n## 业务边界\n\n- 区分“学生社长”与“社团成员”双重角色规则：分别制定不同的起始门槛、递增幅度与最高封顶学分。\n- 学分规则属于计算换算方案，独立于“学分申请表配置”；申请表所需填写的收获与体会、证明材料等由表单设置管理。\n- 规则版本隔离：规则修改只对后续提交或新认定的学分生效，已完成终审归档的学分记录锁定历史规则版本与折算结果，绝不自动重算。\n", "confirmed": false, "updatedAt": "2026-11-09T06:52:04.836Z"}, {"id": "56da9592-b13a-4d49-a3ac-4bdb5ae3501d", "pageId": "club-activities", "stateId": "default", "markdown": "## 页面定位\n\n- 查看与核对社团按场次推进活动的客观过程事实（活动发布、时间、地点、出勤、活动记录与材料）；为教师了解社团活跃度与真实性提供第一手依据。\n- 坚持“客观过程事实是认定基础”原则；无活动记录仅反映系统数据现状，不据此推断线下未开展活动，教师只读了解，不替代社长发活动。\n\n## 业务边界\n\n- 活动开展以场次为单位沉淀：每场活动独立记录时间、场地、应到人数与出勤人数。\n- 活动瞬间是社团内部图文交流：仅社团成员可见，教师只读查看，用于感知社团氛围，不与严谨学时进行直接折算。\n- 活动详情抽屉承接：点击某场活动进入单场详情，查看该场活动概况、考勤实到名单及社长提交的开展材料。", "confirmed": false, "updatedAt": "2026-11-06T01:37:53.000Z"}, {"id": "5a92c9c9-a243-48f5-8631-9deb88e8b5f8", "pageId": "club-showcase", "stateId": "default", "markdown": "## 页面定位\n\n- 查看与监管以社团为载体沉淀的学生成果（作品集锦与荣誉时刻）；作为面向全校展示学生社团育人成效与实践风采的长期资产窗口。\n- 强调“成果属于学生创作、社长负责维护、教师支持监管”；作品必须如实署名具体创作者，社长仅为上传与维护人。\n\n## 业务边界\n\n- 作品与荣誉跨学期存续：成果以“社团”为生命周期维度持续沉淀累积，不受学期切换影响，不按学期清空或拆分。\n- 教师默认只读查看，不设置日常逐件上传审核流程；教师重点负责内容安全性、真实性与合规性治理监督。", "confirmed": false, "updatedAt": "2026-11-06T01:37:53.000Z"}, {"id": "9b679206-f965-4ff6-9200-9f8e981d049d", "pageId": "application-form", "stateId": "default", "markdown": "## 页面定位\n\n- 供具备「配置管理」权限的教师设置学生申报社团时填写的内容；全校共用一份申报表，不按社团类别维护多套模板。\n- 页面分「业务字段 / 自定义字段」两步配置，各区块规则见页面标注。\n", "confirmed": false, "updatedAt": "2026-11-09T18:00:00.000Z"}, {"id": "23e7529c-b057-471e-bb9e-7ce1f7b9ebc1", "pageId": "applications", "stateId": "default", "markdown": "## 页面定位\n\n- 教师处理社团申报、结束申请、延续申请三类审核的统一入口；审核操作规则见申报审核工作台页面标注。\n", "confirmed": false, "updatedAt": "2026-11-09T16:30:00.000Z"}, {"id": "f01d657b-3444-4f63-9ccd-f44e03758224", "pageId": "credits", "stateId": "default", "markdown": "## 页面定位\n\n- 教师终审学分申请的列表入口；成员申请由社长初审后提交教师终审，社长本人申请直接进入教师终审。\n", "confirmed": false, "updatedAt": "2026-11-09T16:30:00.000Z"}, {"id": "a3f7d9bf-3fe3-4b23-9968-349f1737ed37", "pageId": "application-review", "stateId": "default", "markdown": "## 页面定位\n\n- 社团申报审核工作台；结束申请、延续申请工作台共用同一套页面结构与审核规则，仅内容要点不同：社团申报为申报内容快照；结束申请展示成员数、已记录活动数与申请说明；延续申请展示延续安排与下学期申报内容，社长沿用申请人本人。\n", "confirmed": false, "updatedAt": "2026-11-09T16:30:00.000Z"}, {"id": "16fb4621-5af9-4db0-bfcd-b02defa92d69", "pageId": "credit-review", "stateId": "default", "markdown": "## 页面定位\n\n- 社团学分终审工作台；学分根据核定学时按「配置 → 学分规则」折算。\n", "confirmed": false, "updatedAt": "2026-11-09T08:55:48.807Z"}, {"id": "b4d3c8e9-6f7a-4b0c-9e1d-2f3a4b5c6d7e", "pageId": "application-form-preview", "stateId": "default", "markdown": "## 页面定位\n\n- 「社团申报表-查看表单」入口的学生实际填写视角预览（只读复刻）；具体可配置项以申报表设置页为准。\n", "confirmed": false, "updatedAt": "2026-11-09T17:20:00.000Z"}, {"id": "c5e4d9f0-7a8b-4c1d-0f2e-3a4b5c6d7e8f", "pageId": "credit-form", "stateId": "default", "markdown": "## 页面定位\n\n- 学分申请表设置页，分「业务字段 / 自定义字段」两步设置学生申请学分时填写的内容。\n", "confirmed": false, "updatedAt": "2026-11-09T17:20:00.000Z"}, {"id": "d6f5e0a1-8b9c-4d2e-1a3f-4b5c6d7e8f9a", "pageId": "credit-form-preview", "stateId": "default", "markdown": "## 页面定位\n\n- 「学分申请表-查看表单」入口的学生实际填写视角预览（只读）。\n", "confirmed": false, "updatedAt": "2026-11-09T17:20:00.000Z"}, {"id": "e7a6f1b2-9c0d-4e3f-2b4a-5c6d7e8f9a0b", "pageId": "material-form", "stateId": "default", "markdown": "## 页面定位\n\n- 活动开展材料设置页，分「业务字段 / 自定义字段」两步设置社长提交活动记录时填写的内容。\n", "confirmed": false, "updatedAt": "2026-11-09T17:20:00.000Z"}, {"id": "f8b7a2c3-0d1e-4f4a-3c5b-6d7e8f9a0b1c", "pageId": "material-form-preview", "stateId": "default", "markdown": "## 页面定位\n\n- 「活动开展材料-查看表单」入口的社长实际填写视角预览（只读）。\n", "confirmed": false, "updatedAt": "2026-11-09T17:20:00.000Z"}, {"id": "cf7e1a54-6b6a-42fa-bc46-9eae404a0495", "pageId": "proxy-application", "stateId": "default", "markdown": "页面同学生端-申报社团\n", "confirmed": false, "updatedAt": "2026-11-09T09:10:02.726Z"}], "annotations": [{"id": "a101cf10-6faa-401f-8c4f-b0d1c05d1e30", "pageId": "home", "stateId": "club-info", "number": 1, "body": "### 页面显示\n\n- 当前情况仅展示成员与名额、活动记录、待社长审核的入团申请三项运行事实；活动无记录时显示“暂无活动记录”，不据此评价社团运行质量。\n\n### 业务规则\n\n- 人数上限仅支持有管理权限的教师扩大，调整值必须大于当前上限；不支持缩减、不要求调整原因，也不建设单独的名额调整记录。", "anchor": {"protoId": "club-info-overview", "selector": "[data-proto-id=\"club-info-overview\"]", "tag": "section", "text": "当前情况"}, "placement": {"kind": "element", "x": 0, "y": 0, "rx": 0, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-02T09:58:08.248769+00:00"}, {"id": "afc8e78e-c555-491d-8e6c-d9f4b9d11f02", "pageId": "home", "stateId": "club-info", "number": 2, "body": "### 页面显示\n\n- 固定展示社团类别、社团来源、当前学生社长及联系电话；学生社长同时展示姓名和年级，顶部上下文另展示行政班级。", "anchor": {"protoId": "club-info-basics", "selector": "[data-proto-id=\"club-info-basics\"]", "tag": "section", "text": "基本信息"}, "placement": {"kind": "element", "x": 0, "y": 0, "rx": 0, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-02T09:58:08.248769+00:00"}, {"id": "3ae98688-3d64-4682-b9ed-6eca53dc23cb", "pageId": "home", "stateId": "club-info", "number": 3, "body": "### 业务规则\n\n- 学生申报的拟用场地、场地说明与教师的学校日常安排分别保留；教师只可调整学校日常安排，不改写学生原始输入，也不把日常安排当作单场活动的实际场地。", "anchor": {"protoId": "club-info-venue", "selector": "[data-proto-id=\"club-info-venue\"]", "tag": "section", "text": "活动场地"}, "placement": {"kind": "element", "x": 0, "y": 0, "rx": 0, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-02T09:58:08.248769+00:00"}, {"id": "0ee1897c-ac44-463f-8277-9af0cc58ff05", "pageId": "home", "stateId": "club-info", "number": 4, "body": "### 交互说明\n\n1. 点击“查看本学期申报资料”后，以只读快照查看本学期提交与审核时的申报内容；快照不因当前信息调整而改写。", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2) > section > div:nth-of-type(2) > section:nth-of-type(2) > div:nth-of-type(1)", "tag": "div", "text": "基本信息 查看本学期申报资料", "parentText": "基本信息 查看本学期申报资料 社团类别 文史学院 社团来源 从上学期延续 学生社长 赵晨 · 八年级 联系电话 188 3333 1026 社团介绍 面向对围棋感兴趣的同学，开展棋艺交流、对弈复盘与校园棋类活动。 活动场地 学生申报 原始内容 拟用场地 图书馆研讨室 教师日常安排 可调整 图书馆研讨室 调整场地 实际场地以活动记录为准", "htmlSnippet": "<div class=\"club-detail-section-head\"><h3>基本信息<\/h3><button type=\"button\" class=\"club-view-action\" data-proto-id=\"club-info-application-snapshot\">查看本学期申报资料<\/button><\/div>", "rect": {"x": 266, "y": 529, "width": 921, "height": 32}, "conditions": [{"selector": "#root > div > main > section > div:nth-of-type(2) > section > div:nth-of-type(1) > button:nth-of-type(1)", "kind": "aria-selected", "value": "true", "option": "社团信息", "label": "", "explicit": false}]}, "placement": {"kind": "element", "x": 795.1500000000001, "y": -0.5154999999999745, "rx": 0.863355048859935, "ry": 0}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-02T10:57:40.335Z"}, {"id": "54c187ad-2873-48ea-b7fc-a09e1c8a0e05", "pageId": "home", "stateId": "club-members", "number": 1, "body": "### 页面显示\n\n- 概况只显示当前有效成员数及待社长审核人数，不重复展示名额上限，也不设置“成员名册”标题或“当前学期已确认成员关系”等说明。", "anchor": {"protoId": "member-management", "selector": "#root > div > main > section > div:nth-of-type(2) > section > div:nth-of-type(2) > section", "tag": "section", "text": "当前 3 人 3 人待社长审核 查看变更记录 导入成员 添加成员 学生 年级 班级 身份 成员来源 lder=\"搜索学生、年级、班级或角色\" value=\"\">", "rect": {"x": 362, "y": 376, "width": 214, "height": 22}, "conditions": [{"selector": "#root > div > main > section > div:nth-of-type(2) > section > div:nth-of-type(1) > button:nth-of-type(2)", "kind": "click", "value": "true", "option": "成员管理", "label": "切换到成员管理", "explicit": true}, {"selector": "#root > div > main > section > div:nth-of-type(2) > section > div:nth-of-type(1) > button:nth-of-type(2)", "kind": "aria-selected", "value": "true", "option": "成员管理", "label": "", "explicit": false}]}, "placement": {"kind": "element", "x": 194.815875, "y": 8.276999999999987, "rx": 0.9122862369210507, "ry": 0.37622727272727213}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-09T09:35:46.314Z"}, {"id": "b07a84f0-b6d9-466e-8742-302c16bbc27e", "pageId": "club-members", "stateId": "default", "number": 4, "body": "## 教师批量导入成员\n\n### 业务逻辑与校验\n\n1. **线下确认承接**：仅承接线下社团招新沟通完成后统一录入，不伪造社长线上审批过程，直接确立有效成员关系，来源严格记录为“教师添加”。\n2. **模板校验**：支持下载标准 Excel 模板；导入时逐行校验学籍有效性、是否已在本社团（去重）、学生个人加入上限以及社团剩余可用名额。\n3. **超额拦截**：若导入人数超过社团当前剩余名额，整批拦截或标红超额名单提示，确保名额不被穿透。", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2) > section > div:nth-of-type(2) > section > div:nth-of-type(2)", "tag": "div", "text": "导入成员 添加成员", "parentText": "当前 3 人 3 人待社长审核 查看变更记录 导入成员 添加成员 学生 年级 班级 身份 成员来源 加入时间 操作 赵晨 八年级 （3）班 学生社长 社团申报通过 2026-02-25 16:20 — 王嘉宁 八年级 （5）班 团员 自主报名 2026-09-13 19:22 移出成员 李沐阳 七年级 （2）班 团员 教师添加 2026-09-18 15:26 移出成员", "htmlSnippet": "<div class=\"member-list-toolbar\"><div class=\"member-list-tools\"><label class=\"search-field\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" fill=\"currentColor\" viewBox=\"0 0 256 256\" aria-hidden=\"true\"><path d=\"M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z\"><\/path><\/svg><input data-proto-id=\"member-management-search\" placeholder=\ ction > div:nth-of-type(1) > button:nth-of-type(2)", "kind": "click", "value": "true", "option": "成员管理", "label": "切换到成员管理", "explicit": true}, {"selector": "#root > div > main > section > div:nth-of-type(2) > section > div:nth-of-type(1) > button:nth-of-type(2)", "kind": "aria-selected", "value": "true", "option": "成员管理", "label": "", "explicit": false}]}, "placement": {"kind": "element", "x": 80.41000000000008, "y": 11.629000000000019, "rx": 0.4786309523809529, "ry": 0.3634062500000006}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-09T10:04:42.833Z"}, {"id": "cb7dfbc5-e73d-4feb-aea4-641bd6cce0ad", "pageId": "club-members", "stateId": "default", "number": 6, "body": "## 教师移出成员与变更记录留痕\n\n### 移出治理逻辑\n\n| 业务要素 | 规则定义 | 详细说明 |\n|---|---|---|\n| 操作主体与限制 | 仅有权限的教师可操作 | 第一期不开放学生社长在线直接移出团员，也不提供团员自助退团；均需线下沟通后由教师执行。 |\n| 移出必填项 | 移出依据 + 移出详细说明 | 移出依据单选（如：学生本人提出、违纪违规、转学休学、信息录入错误等）；说明详细记录沟通背景。 |\n| 成员关系影响 | 当前有效成员关系终止 | 立即从当前名册移除，社团有效成员数 -1，释放出 1 个可用名额。 |\n| 既有历史事实影响 | 历史过程事实严格保留 | 不删除该学生已参加活动的签到出勤、已发布的动态瞬间、已获得的成果以及期末已认定的学分记录。 |\n\n### 变更记录抽屉\n\n- 点击“查看变更记录”，滑出右侧抽屉，包含“批量导入、单个添加、移出成员”的全量操作日志。\n- 已移出成员列表清晰呈现：姓名、班级、移出依据、详细说明、操作教师及操作时间，便于学校合规审计。", "anchor": {"protoId": "member-management-summary", "selector": "#root > div > main > section > div:nth-of-type(2) > section > div:nth-of-type(2) > section > div:nth-of-type(1)", "tag": "div", "text": "当前 3 人 3 人待社长审核 查看变更记录", "parentText": "当前 3 人 3 人待社长审核 查看变更记录 导入成员 添加成员 学生 年级 班级 身份 成员来源 加入时间 操作 赵晨 八年级 （3）班 学生社长 社团申报通过 2026-02-25 16:20 — 王嘉宁 八年级 （5）班 团员 自主报名 2026-09-13 19:22 移出成员 李沐阳 七年级 （2）班 团员 教师添加 2026-09-18 15:26 移出成员", "htmlSnippet": "<div class=\"member-list-summary member-list-summary-with-action\" data-proto-id=\"member-management-summary\" aria-label=\"成员概况\"><div><span>当前 <strong>3<\/strong> 人<\/span><i aria-hidden=\"true\"><\/i><span>3 人待社长审核<\/span><\/div><button type=\"button\" class=\"club-view-action member-history-action\" data-proto-id=\"member-management-changes\">查看变更记录<\/ 结题归档                  |\n\n### 已移出成员事实保留\n\n- 若学生在被移出前已提交学分申请或已由教师认定了学分，本页必须保留其记录并在姓名列打上灰度“已移出”标签，保证评价事实真实完整。\n", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2) > section > div:nth-of-type(2) > section > div:nth-of-type(2) > table > thead > tr > th:nth-of-type(1)", "tag": "th", "text": "学生", "parentText": "学生 身份 审核状态 提交时间 申报学时 社长核定 教师核定 计入学分 处理时间", "htmlSnippet": "<th>学生<\/th>", "rect": {"x": 267, "y": 366, "width": 150, "height": 42}, "conditions": [{"selector": "#root > div > main > section > div:nth-of-type(2) > section > div:nth-of-type(1) > button:nth-of-type(5)", "kind": "click", "value": "true", "option": "成员学分", "label": "切换到成员学分", "explicit": true}, {"selector": "#root > div > main > section > div:nth-of-type(2) > section > div:nth-of-type(1) > button:nth-of-type(5)", "kind": "aria-selected", "value": "true", "option": "成员学分", "label": "", "explicit": false}]}, "placement": {"kind": "element", "x": 49.33332824707031, "y": 33.5, "rx": 0.3280232159151945, "ry": 0.7976190476190477}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-09T09:52:44.498Z"}, {"id": "c7c2f5da-58c9-45aa-9385-d60a5846ede5", "pageId": "club-history", "stateId": "default", "number": 1, "body": "## 社团生命周期 5 类关键事件全要素拆解与呈现规范\n\n### 5 类关键事件全要素拆解\n\n| 事件类型 | 触发业务场景与时点 | 触发操作主体 | 客观事实描述文本模板 | 核心留痕字段 | 对社团下游运行的影响 |\n|---|---|---|---|---|---|\n| **社团首次成立** | 学生申报社团经教师审核通过时 | 审核教师 | “社团申报审核通过，[学生姓名] 成为首任学生社长。” | 申报人、审核教师、成立时间、初始类别 | 社团正式生成并进入社团列表，开放成员报名与活动发布 |\n| **延续至本学期** | 延续申请审核通过，或教师直接办理学期延续时 | 学生社长（申请）+ 教师（审核）/ 教师（直接延续） | - 若社长不变：“由 [来源学期]‘[社团名称]’延续，[学生姓名] 继续担任学生社长。”<br>- 若社长调整：“由 [来源学期]‘[社团名称]’延续，[学生姓名] 担任学生社长。” | 来源学期、新学期、学生社长、审核/经办教师、延续时间 | 生成新学期该社团运行实例，继承成员与成果，开放新学期报名 |\n| **提前结束本学期社团** | 教师因特殊原因在社团运行期间提前终止社团 | 经办教师 | “本学期社团提前结束运行。结束依据：[依据选项]，说明：[详细原因]。” | 操作教师、结束时间、结束依据、详细说明 | 状态变更为“已提前结束”，冻结成员入团报名、冻结活动发布 |\n| **恢复本学期社团运行** | 教师对已提前结束的社团撤销停办并恢复运行 | 经办教师 | “恢复本学期社团运行。说明：[恢复说明]。” | 操作教师、恢复时间、恢复说明 | 状态恢复为“进行中”，解冻入团报名与活动发布能力 |\n| **学期结束／归档** | 学期结束归档或教师手动结题归档时 | 系统定时自动 / 教师管理员 | “本学期社团运行周期结束，归档入库。最终正式成员 [N] 人，开展活动 [M] 场。” | 归档时间、总成员数、总活动场次、处理人/系统 | 冻结所有在办业务，社团转入历史档案，作为下学期延续依据 |\n\n### 呈现规范与排除项\n\n| 维度项 | 规范要求 | 详细说明 |\n|---|---|---|\n| 排序规则 | 严格倒序排列 | 最新发生的事件置于时间线最顶端，最早成立事件在时间线底部 |\n| 节点要素 | 3 大必备元素 | 每一个时间轴节点必须且仅包含：**事件名称**、**客观事实描述**、**发生时间戳**（精确到分或日） |\n| 严格排除项 | 禁止录入的日常事件 | 1. 成员日常加入或移出；<br>2. 某场日常活动的发布、修改或签到；<br>3. 成员作品或荣誉的上传；<br>4. 成员日常学分审核或退回；<br>5. 申报未通过或被退回的记录（未成立不形成社团历程）。 |\n\n- 社长变更规则：当前设计社长不支持学期中任意更换，仅在“延续到下学期”时支持换届换人；因此换社长事实自然融入“延续至本学期”事件中，不单设独立的社长变更事件。", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2) > section > div:nth-of-type(1)", "tag": "div", "text": "社团信息 成员管理 活动一览 作品与荣誉 成员学分 社团历程", "parentText": "2026-2027学年第一学期 文史学院 围棋社 上学期延续 社长：赵晨 · 八年级 · 188 3333 1026 延续到下学期 提前结束 社团信息 成员管理 活动一览 作品与荣誉 成员学分 社团历程 延续至本学期 由 2025—2026 学年第二学期“围棋社”延续，赵晨继续担任学生社长。 2026年8月20日 09:30 学期结束并归档 2025—2026 学年第二学期社团运行结束，已归档。 2026年7月10日 17:30 恢复本学期社团运行 本学期社团已恢复运行。 2026年3月27日 10:00 提前结束本学期社团 本学期社团已提前结束。 2026年3月20日 16:45 社团首次成立 社团申报审核通过，赵晨成为学生社长。 2026年2月14日 10:14", "htmlSnippet": "<div class=\"club-detail-tabs\" role=\"tablist\" aria-label=\"社团详情导航\"><button type=\"button\" role=\"tab\" data-proto-id=\"club-detail-tab-info\" data-proto-hotspot=\"true\" aria-selected=\"false\" class=\"\">社团信息<\/button><button type=\"button\" role=\"tab\" data-proto-id=\"club-detail-tab-members\" data-proto-hotspot=\"true\" aria-selected=\"false\" class=\"\">成员管理<\/button><button type=\"button\" role=\"tab\" data-proto-id=\"club-detail-tab-activities\" data-proto-hotspot=\"true\" aria-selected=\"false\" class=\"\">活动一览<\/button><button type=\"button\" role=\"tab\" data-proto-id=\"club-detail-tab-showcase\" data-proto-hotspot=\"true\" aria-selected=\"false\" class=\"\">作品与荣誉<\/button><button type=\"button\" role=\"tab\" data-proto-id=\"club-detail-tab-credits\" data-proto-hotspot=\"true\" aria-selected=\"false\" class=\"\">成员学分<\/button><button type=\"button\" rol  每行固定“查看＋更多”。更多：延续到下学期、提前结束。若无下学期，则按钮置灰/不显示。 |\n", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2) > section:nth-of-type(2) > div:nth-of-type(2) > table > thead > tr > th:nth-of-type(1)", "tag": "th", "text": "社团名称", "parentText": "社团名称 社团类别 学生社长 成员与名额 活动记录 操作", "htmlSnippet": "<th>社团名称<\/th>", "rect": {"x": 243, "y": 275, "width": 176, "height": 44}, "conditions": [{"selector": "#root > div > main > section > div:nth-of-type(2) > div > div > label:nth-of-type(1) > select", "kind": "select", "value": "2026-2027学年第一学期", "option": "2026-2027学年第一学期", "label": "学期 2026-2027学年第二学期 2026-2027学年第一学期 2025-2026学年第二学期", "explicit": false}]}, "placement": {"kind": "element", "x": 97.93, "y": 21.589999999999975, "rx": 0.5551636476371851, "ry": 0.4906818181818176}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-09T09:19:53.672Z"}, {"id": "173dd8e8-2751-4699-9af6-cd9b9ae83c00", "pageId": "home", "stateId": "default", "number": 5, "body": "### 代学生申报\n\n- 这是次级入口；教师代填必须指定学生社长，不产生教师本人负责的社团。\n- <span style=\"color:#ec4954\">是否自动通过取决于代申报权限、审核权限和全部提交校验，不能因代填而默认跳过审核。<\/span>\n", "anchor": {"protoId": "clubs-proxy-application"}, "placement": {"kind": "element", "x": 0, "y": 0, "rx": 0, "ry": 0}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:03:02.092Z"}, {"id": "d7d18a0d-82a5-4263-a1c6-6e2d54cad506", "pageId": "basic-settings-edit", "stateId": "default", "number": 2, "body": "## 数量设置\n\n### 信息\n\n\n| 设置项                 | 可设置值         | 适用范围                             |\n| ---------------------- | ---------------- | ------------------------------------ |\n| 每名学生最多发起社团数 | 正整数或不限数量 | 当前学期，学生发起新社团申报         |\n| 每名学生最多加入社团数 | 正整数或不限数量 | 当前学期，学生申请加入和社长确认成员 |\n\n### 业务逻辑\n\n\n| 设置项         | 校验时点                       | 计数口径                                                               |\n| -------------- | ------------------------------ | ---------------------------------------------------------------------- |\n| 最多发起社团数 | 提交新的社团申报时             | 按学生、按当前学期计算；同一申报被退回后修改或重新提交，仍只计为一次。 |\n| 最多加入社团数 | 提交入团申请时、社长确认成员时 | 两个时点均校验；以当前学期已生效的成员关系为准，确认成员前须再次校验。 |\n\n### 校验\n\n- 设置数量时只能填写大于 0 的整数；选择“不限数量”后不再填写具体数值。\n- 达到上限时，学生不能再提交对应的新申请；社长确认成员时若该学生已达到加入上限，不能确认。\n\n### 异常说明\n\n- 已达到上限后调低数量，不自动撤销既有申报或移出既有成员；后续新申请和成员确认按调整后的数量校验。\n- 教师按权限进行例外成员调整时，必须记录调整人、调整时间和调整原因。\n", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2) > div > div > div:nth-of-type(2) > section:nth-of-type(2) > div:nth-of-type(1) > div > div > div", "tag": "div", "text": "数量设置", "parentText": "数量设置 设置学生本学期可发起和加入的社团数量上限。", "htmlSnippet": "<div class=\"setting-card-title-row\"><h2>数量设置<\/h2><\/div>", "rect": {"x": 311, "y": 628, "width": 767, "height": 23}}, "placement": {"kind": "element", "x": 66.66631298828128, "y": 8.260750000000002, "rx": 0.08695605811194228, "ry": 0.3671444444444445}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-09T06:11:02.963Z"}, {"id": "a67aa06c-08a3-41af-bb4b-ddfff244e0f2", "pageId": "activity-notice", "stateId": "default", "number": 1, "body": "### 展示开关\n\n- 开启后，学生可在社团申报中主动查看说明；不使用强制弹窗阻断申报。\n- 关闭后隐藏学生端入口，已保存内容保留，重新开启后继续生效。", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2) > div > div > section > div:nth-of-type(1) > div > div:nth-of-type(1)", "tag": "div", "text": "向学生展示社团申报说明", "parentText": "向学生展示社团申报说明 开启后，学生在“社团申报”中可主动查看；不作为强制弹窗阻断", "htmlSnippet": "<div class=\"rule-item-title\">向学生展示社团申报说明<\/div>", "rect": {"x": 267, "y": 217, "width": 377, "height": 21}}, "placement": {"kind": "element", "x": 190.00031298828122, "y": 12.760578247070299, "rx": 0.5039796100484913, "ry": 0.6076465831938238}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-09T06:28:36.041Z"}, {"id": "e0a600f2-f154-4a80-b308-ff169e9d2ae0", "pageId": "activity-notice", "stateId": "default", "number": 2, "body": "### 说明内容\n\n- 说明承载规则提示、材料指引和咨询信息，不替代申报表字段、时间窗口或审核标准。\n- 内容、标题和附件保存后用于学生端展示。\n- 附件要求：支持 PDF、Word、JPG、PNG，单个文件最大不超过 20MB，最多不超过 5 个文件。\n", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2) > div > div > section > div:nth-of-type(2) > div:nth-of-type(1) > span", "tag": "span", "text": "说明标题", "parentText": "说明标题", "htmlSnippet": "<span>说明标题<\/span>", "rect": {"x": 267, "y": 295, "width": 810, "height": 20}}, "placement": {"kind": "element", "x": 86.26999999999998, "y": 14.037562499999979, "rx": 0.10650617283950616, "ry": 0.7198749999999989}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-09T06:30:02.897Z"}, {"id": "79fc1514-bc50-4834-8918-701d0bfd3f5f", "pageId": "form-settings", "stateId": "default", "number": 2, "body": "### 业务规则\n\n- 三类表单：社团申报表（学生申报社团）、学分申请表（学生申请学分）、活动开展材料（社长提交活动记录）。\n- 每类提供「查看表单」（学生实际填写视角的只读预览）与「设置」（进入字段配置页）。\n- 系统固定字段不可删除或改名；可配置的是字段标题、提示与必填，申报表的自定义字段可增删和排序。", "anchor": {"protoId": "form-settings-list", "selector": "#root > div > main > section > div:nth-of-type(2) > div > section", "tag": "section", "text": "表单内容 设置学生提交时需要填写的内容。 表单名称 说明 操作 社团申报表 设置学生申报社团时需填写的补充问题和材料。 查看表单 设置 学分申请表 设置学生申请学分时需填写的申报学时、收获与体会和证明材料。 查看表单 设置 活动开展材料 设置社长填写活动记录时需提交的活动纪要和现场照片与成果。 查看表单 设置", "parentText": "修改仅影响后续提交；已提交内容保留原表单。 表单内容 设置学生提交时需要填写的内容。 表单名称 说明 操作 社团申报表 设置学生申报社团时需填写的补充问题和材料。 查看表单 设置 学分申请表 设置学生申请学分时需填写的申报学时、收获与体会和证明材料。 查看表单 设置 活动开展材料 设置社长填写活动记录时需提交的活动纪要和现场照片与成果。 查看表单 设置", "htmlSnippet": "<section class=\"settings-config-group\" data-proto-id=\"form-settings-list\" aria-label=\"表单设置\"><div class=\"settings-config-group-head\"><h2>表单内容<\/h2><p>设置学生提交时需要填写的内容。<\/p><\/div><div class=\"config-table\"><div class=\"config-head\"><span>表单名称<\/span><span>说明<\/span><span class=\"config-th-action\">操作<\/span><\/div><div class=\"config-row\"><div class=\"config-type\"><span class=\"config-title\">社团申报表<\/span><\/div><p class=\"config-desc\">设置学生申报社团时需填写的补充问题和材料。<\/p><div class=\"config-action-wrap form-setting-actions\"><button type=\"button\" class=\"config-action\" aria-label=\"查看社团申报表填写内容\">查看表单<\/button><button type=\"button\" class=\"config-action\" aria-label=\"设置社团申报表\">设置<\/button><\/div><\/div><div class=\"config-row\"><div class=\"config-type\"><span class=\"config-title\">学分申请表<\/span><\/div><p class=\"config-desc\">设置学生申请学分时需填写的申报学时、收获与体会和证明材料。<\/p><div class=\"config-action-wrap form-setting-actions\"><button type=\"button\" class=\"config-action\" aria-label=\"查看学分申请表填写内容\">查看表单<\/button><button type=\"button\" class=\"config-action\" aria-label=\"设置学分申请表\">设置<\/button><\/div><\/div><div class=\"config-row\"><div class=\"config-type\"><span class=\"config-title\">活动开展材料<\/span><\/div><p class=\"config-desc\">设置社长填写活动记录时需提交的活动纪要和现场照片与成果。<\/p><div class=\"config-action-wrap form-setting-actions\"><button type=\"button\" class=\"config-action\" aria-label=\"查看活动开展材料填写内容\">查看表单<\/button><button type=\"button\" class=\"config-action\" aria-label=\"设置活动开展材料\">设置<\/button><\/div><\/div><\/div><\/section>", "rect": {"x": 242, "y": 193, "width": 860, "height": 282}}, "placement": {"kind": "element", "x": 271.28, "y": 29.479828247070316, "rx": 0.31544186046511624, "ry": 0.10466210455993259}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-09T08:03:56.207Z"}, {"id": "b77692be-ab9e-4d1a-b6c7-da9e1d9b28d0", "pageId": "category-settings", "stateId": "default", "number": 1, "body": "## 社团类别基础设置、信息结构与交互\n\n### 信息结构\n\n\n| 字段项       | 字段类型 | 约束条件                 | 业务说明                                               |\n| ------------ | -------- | ------------------------ | ------------------------------------------------------ |\n| 社团类别     | 文本     | 必填，1-10字符，全校唯一 | 社团所属分类（如科技创新、文化艺术、体育运动等）       |\n|              |          |                          |                                                        |\n| 关联社团数   | 统计数值 | 系统只读统计             | 当前及历史关联该类别的正式社团总数，用于删除前影响评估 |\n| 申报审核老师 | 人员选择 | 选填，支持多名/单名      | 指定负责该类别社团申报审核的教师名单；用于审核路由     |\n| 操作         | 文本按钮 | -                        | 支持 编辑/删除                                         |\n|              |          |                          |                                                        |\n\n### 交互说明\n\n1. 搜索框支持按“社团类别”或“审核老师”进行实时过滤。\n2. 点击右上角“新增类别”，滑出右侧配置抽屉，输入名称、说明并可选指派审核教师。\n", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2) > div > div:nth-of-type(2) > div > span:nth-of-type(1) > input", "tag": "input", "text": "", "parentText": "", "htmlSnippet": "<input placeholder=\"搜索类别或审核老师\" class=\"ant-input css-eofgey\" type=\"text\" value=\"\">", "rect": {"x": 335, "y": 199, "width": 221, "height": 22}}, "placement": {"kind": "element", "x": 159.726, "y": 18.921562499999993, "rx": 0.7227420814479638, "ry": 0.8600710227272724}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-09T06:49:49.513Z"}, {"id": "840c56de-d4da-4581-936e-c7c7377d761d", "pageId": "category-settings", "stateId": "default", "number": 2, "body": "## 类别业务逻辑、审核路由与删除影响\n\n### 业务时点与规则\n\n\n| 业务动作 | 触发时点       | 规则逻辑                                                                   | 影响范围                                                     |\n| -------- | -------------- | -------------------------------------------------------------------------- | ------------------------------------------------------------ |\n| 新增类别 | 教师保存提交   | 字符上限为10（原型仅示意不作为最终规则），需校验名称唯一性，保存后即刻生效 | 学生新建申报可选，列表筛选即刻出现该选项                     |\n| 编辑类别 | 教师修改保存   | 修改名称或审核老师，仅更新基础信息                                         | 不改写历史社团的既有审核动态，后续新申报按新规则流转         |\n| 删除类别 | 教师删除确认   | 状态置为“已删除”                                                         | 学生端新申报不可见该类别；历史已关联社团与进行中社团不受影响 |\n| 审核路由 | 学生提交新申报 | 匹配所选类别是否指派审核老师                                               | 有指派则推送至指定教师待办；无指派则进入全校通用申报待办队列 |\n\n### 删除校验与异常说明\n\n\n| 类别当前关联情况                   | 是否允许删除 | 处理方式与系统反馈                                                              |\n| ---------------------------------- | ------------ | ------------------------------------------------------------------------------- |\n| 关联社团数 = 0 且无待审核申报      | 允许删除     | 二次确认弹窗提示后物理删除该类别。                                              |\n| 关联社团数 > 0（历史或进行中社团） | 禁止直接删除 | 拦截提示：该类别已被 x 个社团使用，删除后不影响已有社团，新申报不再提供该选项。 |\n|                                    |              |                                                                                 |\n", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2)", "tag": "div", "text": "社团类别用于学生申报时选择、列表筛选与数据统计，并可维护对应的申报审核老师；未单独配置时，默认（集中审核）。 共 5 个社团类别 新增类别 序号 社团类别 已关联社团 申报审核老师 操作 1 学术科技 6 个社团 王老师 张老师 编辑 删除 2 文化艺术 8 个社团 李老师 编辑 删除 3 体育健康 4 个社团 周老师 编辑 删除 4 社会服务 2 个社团 王老师 编辑 删除 5 兴趣拓展 0 个社团 默认（集中审核） 编辑 删除", "parentText": "社团类别 社团类别用于学生申报时选择、列表筛选与数据统计，并可维护对应的申报审核老师；未单独配置时，默认（集中审核）。 共 5 个社团类别 新增类别 序号 社团类别 已关联社团 申报审核老师 操作 1 学术科技 6 个社团 王老师 张老师 编辑 删除 2 文化艺术 8 个社团 李老师 编辑 删除 3 体育健康 4 个社团 周老师 编辑 删除 4 社会服务 2 个社团 王老师 编辑 删除 5 兴趣拓展 0 个社团 默认（集中审核） 编辑 删除", "htmlSnippet": "<div class=\"page-content\"><div class=\"settings-page\"><div class=\"settings-effect-note\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"15\" height=\"15\" fill=\"currentColor\" viewBox=\"0 0 256 256\" aria-hidden=\"true\"><path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z\"><\/path><\/svg><span>社团类别用于学生申报时选择、列表筛选与数据统计，并可维护对应的申报审核老师；未单独配置时，默认（集中审核）。<\/span><\/div><div class=\"category-toolbar\" data-proto-id=\"category-settings-toolbar\"><div class=\"category-toolbar-left\"><span class=\"ant-input-affix-wrapper css-eofgey ant-input-outlined css-var-root ant-input-css-var\" style=\"width: 280px; height: 32px;\"><span class=\"ant-input-prefix\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"15\" height 该角色下可获得的最高学分封顶值 | 学生社长 / 社团成员 | 正数，必须 ≥ 起始学分         |\n\n### 计算公式\n\n- 当 `核定学时 < 起始学时` 时：建议学分 = `0`\n- 当 `核定学时 >= 起始学时` 时：\n  $$\n  建议学分 = min(起始学分 + floor((核定学时 - 起始学时) / 递增间隔学时) × 递增学分, 最高学分上限)\n  $$\n", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2)", "tag": "div", "text": "修改仅影响后续提交的学分申请，已认定结果不变。 申请说明、证明材料等内容，请在 表单设置 - 学分申请表 中设置。 社长学分规则 满 4 小时得 8 学分；每超 1 小时加 4 学分；最高 20 学分 团员学分规则 满 4 小时得 6 学分；每超 1 小时加 3 学分；最高 18 学分 查看换算示例", "parentText": "学分规则 编辑规则 修改仅影响后续提交的学分申请，已认定结果不变。 申请说明、证明材料等内容，请在 表单设置 - 学分申请表 中设置。 社长学分规则 满 4 小时得 8 学分；每超 1 小时加 4 学分；最高 20 学分 团员学分规则 满 4 小时得 6 学分；每超 1 小时加 3 学分；最高 18 学分 查看换算示例", "htmlSnippet": "<div class=\"page-content\"><div class=\"settings-page credit-rule-page\"><div class=\"settings-centered-wide\"><div class=\"settings-effect-note\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"15\" height=\"15\" fill=\"currentColor\" viewBox=\"0 0 256 256\" aria-hidden=\"true\"><path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z\"><\/path><\/svg><span>修改仅影响后续提交的学分申请，已认定结果不变。<\/span><\/div><div class=\"credit-form-scope-hint\"><span>申请说明、证明材料等内容，请在<\/span><button type=\"button\">表单设置 - 学分申请表<\/button><span>中设置。<\/span><\/div><div class=\"credit-rule-main\" data-proto-id=\"credit-rules-formulas\"><section class=\"settings-surface credit-rule-card\"><strong class=\"credit-card-title\">社长学分规则<\/strong><p class=\"credit-rule-formula\">满 4 小时得 8 学分；每超 1 小时加 4 学分；最高 20 学分<\/p><\/section><section class=\"settings-surface credit-rule-card\"><strong class=\"credit-card-title\">团员学分规则<\/strong><p class=\"credit-rule-formula\">满 4 小时得 6 学分；每超 1 小时加 3 学分；最高 18 学分<\/p><\/section><details class=\"credit-example-disclosure\" data-proto-id=\"credit-rules-example\"><summary>查看换算示例<\/summary><div class=\"credit-example-calculator\"><label><span>认定学时<\/span><input min=\"0\" aria-label=\"示例认定学时\" type=\"number\" value=\"6\"><em>小时<\/em><\/label><div class=\"credit-example-results\"><span>社长 <strong>16 学分<\/strong><\/span><span>团员 <strong>12 学分<\/strong><\/span><\/div><\/div><\/details><\/div><\/div><\/div><\/div>", "rect": {"x": 280, "y": 120, "width": 1120, "height": 445}}, "placement": {"kind": "element", "x": 17.351999999999975, "y": 136.199, "rx": 0.01549285714285712, "ry": 0.305963109215676}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-09T06:56:39.457Z"}, {"id": "d9700350-afec-4e4f-9a0c-76d92d0ec2a6", "pageId": "credit-rules", "stateId": "default", "number": 2, "body": "## 业务时点流转、试算验证与保存影响\n\n### 业务时点与动作\n\n\n| 业务时点           | 参与主体   | 计算行为                                        | 边界与留痕                                                 |\n| ------------------ | ---------- | ----------------------------------------------- | ---------------------------------------------------------- |\n| 社长初审（成员端） | 学生社长   | 社长基于出勤事实核定成员实践学时                | 不计算学分，仅核定学时，并提交教师终审                     |\n| 教师终审计算       | 教师审核人 | 输入/微调核定学时，系统实时依据规则折算建议学分 | 实时动态折算；教师可手动修改最终学分值                     |\n| 手动修改学分       | 教师审核人 | 若教师录入的最终学分偏离系统建议学分            | 强制要求填写“调整原因/评语”，记入审批动态                |\n| 规则修改生效       | 教师管理员 | 保存新的学分规则参数                            | 对新进入审核的记录生效；已终审通过的记录严格保留历史折算值 |\n\n### 试算与保存影响\n\n1. 规则编辑区提供“实时试算演示”，输入测试学时即可即时查看社长与成员的折算建议学分，验证规则连续性。\n2. 修改学分规则仅对后续提交或当前处于待审核状态的申请生效；历史已完成终审归档的学分结果锁定历史规则版本，绝不自动重算。\n", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2)", "tag": "div", "text": "修改仅影响后续提交的学分申请，已认定结果不变。 申请说明、证明材料等内容，请在 表单设置 - 学分申请表 中设置。 社长学分规则 满 4 小时得 8 学分；每超 1 小时加 4 学分；最高 20 学分 团员学分规则 满 4 小时得 6 学分；每超 1 小时加 3 学分；最高 18 学分 查看换算示例", "parentText": "学分规则 编辑规则 修改仅影响后续提交的学分申请，已认定结果不变。 申请说明、证明材料等内容，请在 表单设置 - 学分申请表 中设置。 社长学分规则 满 4 小时得 8 学分；每超 1 小时加 4 学分；最高 20 学分 团员学分规则 满 4 小时得 6 学分；每超 1 小时加 3 学分；最高 18 学分 查看换算示例", "htmlSnippet": "<div class=\"page-content\"><div class=\"settings-page credit-rule-page\"><div class=\"settings-centered-wide\"><div class=\"settings-effect-note\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"15\" height=\"15\" fill=\"currentColor\" viewBox=\"0 0 256 256\" aria-hidden=\"true\"><path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z\"><\/path><\/svg><span>修改仅影响后续提交的学分申请，已认定结果不变。<\/span><\/div><div class=\"credit-form-scope-hint\"><span>申请说明、证明材料等内容，请在<\/span><button type=\"button\">表单设置 - 学分申请表<\/button><span>中设置。<\/span><\/div><div class=\"credit-rule-main\" data-proto-id=\"credit-rules-formulas\"><section class=\"settings-surface credit-rule-card\"><strong class=\"credit-card-title\">社长学分规则<\/strong><p class=\"credit-rule-formula\">满 4 小时得 8 学分；每超 1 小时加 4 学分；最高 20 学分<\/p><\/section><section class=\"settings-surface credit-rule-card\"><strong class=\"credit-card-title\">团员学分规则<\/strong><p class=\"credit-rule-formula\">满 4 小时得 6 学分；每超 1 小时加 3 学分；最高 18 学分<\/p><\/section><details class=\"credit-example-disclosure\" data-proto-id=\"credit-rules-example\"><summary>查看换算示例<\/summary><div class=\"credit-example-calculator\"><label><span>认定学时<\/span><input min=\"0\" aria-label=\"示例认定学时\" type=\"number\" value=\"6\"><em>小时<\/em><\/label><div class=\"credit-example-results\"><span>社长 <strong>16 学分<\/strong><\/span><span>团员 <strong>12 学分<\/strong><\/span><\/div><\/div><\/details><\/div><\/div><\/div><\/div>", "rect": {"x": 280, "y": 120, "width": 1120, "height": 445}}, "placement": {"kind": "element", "x": 18.180000000000007, "y": 355.421, "rx": 0.01623214285714286, "ry": 0.7984325453237158}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-09T06:57:51.094Z"}, {"id": "5eaf2b75-5d38-4205-9f35-b4dd8a341c43", "pageId": "club-activities", "stateId": "default", "number": 2, "body": "## 活动瞬间总览与互动边界\n\n### 规则说明\n\n1. **入口与定位**：点击工具栏“查看活动瞬间”，切换至社团维度的图文瀑布流总览；支持按具体单场活动下拉筛选。\n2. **内容特征**：仅限本校本社团成员可见，教师只读。\n", "anchor": {"protoId": "club-activities-moments"}, "placement": {"kind": "element", "x": 0, "y": 0}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-09T09:57:36.142Z"}, {"id": "a824e658-21f3-4231-a67a-5e13d8d5ef86", "pageId": "basic-settings-edit", "stateId": "default", "number": 4, "body": "### 时间设置\n\n\n| 设置项               | 规则校验                                                        | 业务规则                                                                                   | 异常说明                                                   |\n| -------------------- | --------------------------------------------------------------- | ------------------------------------------------------------------------------------------ | ---------------------------------------------------------- |\n| 社团申报时间         | 有限窗口：开始 < 结束；不限时间时不校验日期草稿。               | 窗口内可新建、提交或重新提交；结束后不再允许新提交，已提交申报仍可审核。                   | 开始或结束时间缺失、开始时间不早于结束时间时，不允许保存。 |\n| 入团报名时间         | 有限窗口：开始 < 结束；不限报名时，名单确认也必须不设截止时间。 | 仅窗口内可提交、重新提交；报名结束后不再接收新申请，已提交申请可等社长处理至名单确认截止。 | 报名不限时间但设置了名单确认截止时间时，不允许保存。       |\n| 成员名单确认截止时间 | 名单确认截止时间不早于入团报名结束时间，允许相等。              | 截止后待处理申请自动失效，社长不能确认成员或新增成员。                                     | 早于入团报名结束时间时，不允许保存。                       |\n| 学分申请时间         | 有限窗口：开始 < 结束；不限时间时不校验日期草稿。               | 仅窗口内可新建、提交、重新提交；结束后已提交申请仍可继续审核。                             | 开始或结束时间缺失、开始时间不早于结束时间时，不允许保存。 |\n\n### 时间设置的专属影响\n\n- 将已结束的时间窗口改为未来时间或不限时间，属于重新开放；保存前须二次确认。\n- 把成员名单确认截止时间调至当前时间前，保存前须提示待处理申请将失效；已失效申请不自动恢复。\n", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2) > div > div > div:nth-of-type(2) > section:nth-of-type(1) > div:nth-of-type(1) > div > div > div", "tag": "div", "text": "时间设置", "parentText": "时间设置 设置各项社团业务的开放时间，可勾选“不限时间”。", "htmlSnippet": "<div class=\"setting-card-title-row\"><h2>时间设置<\/h2><\/div>", "rect": {"x": 311, "y": 216, "width": 767, "height": 23}}, "placement": {"kind": "element", "x": 69.33331298828125, "y": 17.854156494140625, "rx": 0.09043475367180193, "ry": 0.79351806640625}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-09T05:46:14.121Z"}, {"id": "b08690cc-8175-4c67-b22b-6a5d764d29df", "pageId": "basic-settings-edit", "stateId": "default", "number": 5, "body": "## 活动开展规则\n\n### 信息\n\n\n| 规则项               | 设置方式   | 作用对象                     |\n| -------------------- | ---------- | ---------------------------- |\n| 活动签到             | 开启／关闭 | 新发布的社团活动及其参与成员 |\n| 要求补充活动开展材料 | 开启／关闭 | 新发布的社团活动及其社长     |\n\n### 交互说明\n\n1. 两项规则可分别开启或关闭，保存后按各自状态生效。\n2. 开启“要求补充活动开展材料”后，材料字段仍由“表单设置”维护；本规则只决定该场活动是否要求补充，不在此处编辑材料内容。\n\n### 业务逻辑\n\n- 开启活动签到后，每场新发布活动生成签到；签到结果沉淀为成员参与和社长组织的客观事实。\n- 开启补充活动开展材料后，社长在活动结束后按已配置的表单补充开展材料；该材料不进入独立审批流。\n\n### 异常说明\n\n- 关闭任一规则不清除已经形成的签到或开展材料；后续新活动按保存后的规则执行。\n", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2) > div > div > div:nth-of-type(2) > section:nth-of-type(3) > div:nth-of-type(1) > div > div > div", "tag": "div", "text": "活动开展规则", "parentText": "活动开展规则 设置活动签到和活动开展材料要求是否启用。", "htmlSnippet": "<div class=\"setting-card-title-row\"><h2>活动开展规则<\/h2><\/div>", "rect": {"x": 311, "y": 912, "width": 767, "height": 23}}, "placement": {"kind": "element", "x": 98.66731298828125, "y": 13.332312988281274, "rx": 0.12869649178688403, "ry": 0.5925472439236121}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-09T06:13:51.910Z"}, {"id": "f5e80716-173c-4580-8b79-2a28ea58460c", "pageId": "basic-settings-edit", "stateId": "default", "number": 6, "body": "### 二次编辑与保存影响\n\n### 保存判断\n\n\n| 保存条件                                                             | 处理方式                                                 |\n| -------------------------------------------------------------------- | -------------------------------------------------------- |\n| 未修改任何有效设置                                                   | 直接保存，不展示影响确认。                               |\n| 学校当前学期尚未产生社团申报、入团申请、成员确认或活动发布等业务事实 | 直接保存，适用于学期开始前的首次设置和准备阶段调整。     |\n| 学校当前学期已产生业务事实，且修改了时间、数量或活动开展规则         | 保存前展示一次影响确认，列出本次改动；确认后保存。       |\n| 重新开放已结束的时间窗口，或将成员名单确认截止时间调至当前时间前     | 在同一影响确认中展示专项风险提示，不额外叠加第二个弹窗。 |\n\n### 业务规则\n\n- 配置页不增加学期切换；系统仅以学校当前学期是否已产生相关业务事实判断是否需要影响确认，不按“第几次编辑”判断。\n- 确认保存后的新规则只作用于后续新发起的业务动作；此前已经形成的社团申报、成员关系、活动、签到、开展材料和学分记录不自动回填、撤销或重算。\n- 如需调整已形成的业务结果，教师须在对应业务对象中通过专门调整操作办理，并留下变更记录。\n\n![image](prd-assets/ffc0b1b14e7f93853bdb36d795d21e75a48710b9a3562311e93dae92697881c3.png)\n", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(1)", "tag": "div", "text": "基本设置 取消 保存修改", "parentText": "基本设置 取消 保存修改 建议在社团开放前确认本学期设置。已开始的业务仍按原设置办理。 时间设置 分别设置各项社团业务的开放时间；如不限制具体时间，可直接勾选“不限时间”。 社团申报时间 不限时间 学生发起并提交新社团申报的时间窗口 入团报名时间 不限时间 学生可在此期间报名；申请未通过时，也可重新报名。结束后不再接受新的申请。 成员名单确认截止时间 不设截止时间 社长须在此时间前审核已提交的申请并确认成员。截止后，未处理的申请自动失效，社长不再新增成员；教师可按权限调整成员并留痕。 学分申请时间 不限时间 学期末社长与成员提交社团学分申请的时间窗口 数量设置 控制学生在本学期可发起的社团数和可作为成员加入的社团数；达到上限后，不再允许提交对应的新申请。 每名学生最多发起社团数 不限数量 个社团 学生提交新社团申报时校验；对同一申报的退回修改或重新提交不重复计数。 每名学生最多加入社团数 ", "htmlSnippet": "<div class=\"page-header\"><div class=\"page-title-row\"><button type=\"button\" class=\"back-button\" aria-label=\"返回学生社团\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" fill=\"currentColor\" viewBox=\"0 0 256 256\" aria-hidden=\"true\"><path d=\"M228,128a12,12,0,0,1-12,12H69l51.52,51.51a12,12,0,0,1-17,17l-72-72a12,12,0,0,1,0-17l72-72a12,12,0,0,1,17,17L69,116H216A12,12,0,0,1,228,128Z\"><\/path><\/svg><\/button><h1>基本设置<\/h1><\/div><div class=\"page-task-actions\"><button type=\"button\" class=\"btn-header-outline\">取消<\/button><button type=\"button\" class=\"btn-header-primary\">保存修改<\/button><\/div><\/div>", "rect": {"x": 224, "y": 56, "width": 1116, "height": 64}}, "placement": {"ki
