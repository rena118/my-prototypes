<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>原型发布列表</title>
  <style>
    :root { --bg:#f7f8f8; --card:#fff; --text:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .wrap { max-width:880px; margin:0 auto; padding:48px 24px 64px; }
    h1 { font-size:22px; margin:0 0 6px; }
    .sub { color:var(--muted); font-size:13px; margin-bottom:28px; }
    .card { display:flex; align-items:center; gap:16px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; text-decoration:none; color:inherit; transition:border-color .15s, box-shadow .15s; }
    .card:hover { border-color:#c7d2fe; box-shadow:0 6px 18px rgba(37,99,235,.08); }
    .icon { width:40px; height:40px; flex:0 0 40px; border-radius:10px; background:#eff6ff; color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:600; }
    .name { font-size:15px; font-weight:600; margin-bottom:4px; }
    .meta { font-size:12px; color:var(--muted); }
    .arrow { margin-left:auto; color:#9ca3af; font-size:18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>原型发布列表</h1>
    <div class="sub">共 1 个原型 · 点击卡片进入原型评审页</div>

      <div class="icon">原</div>
      <div>
        <div class="name">student-desktop-prototype</div>
        <div class="meta">学生社团 · 学生桌面端原型 · 最近更新 2026-11-04</div>
      </div>
      <div class="arrow">→</div>
    </a>
  </div>
</body>
</html>
